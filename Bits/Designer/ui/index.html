<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>StreamCraft Bit Designer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/designer/ui/styles.css" />
</head>
<body class="designer-body">
    <div class="designer-app">
        <header class="app-header">
            <div class="header-left">
                <p class="header-eyebrow">StreamCraft Designer</p>
                <h1>Overlay Draft</h1>
                <p class="subtitle">Drag widgets, bind data inline, and preview overlays at full scale.</p>
            </div>
            <div class="header-right">
                <div class="header-actions">
                    <a class="btn ghost" href="/designer/ui/metadata.html">API Metadata</a>
                    <button class="btn primary">Preview Live</button>
                    <button class="btn warning" disabled>Publish</button>
                </div>
            </div>
        </header>

        <section class="tools-row">
            <div class="tools-header">
                <div>
                    <p class="section-kicker">Tools | Widgets</p>
                    <h2>Widget Palette</h2>
                </div>
                <div class="tools-controls">
                    <label class="control">
                        <span>Category</span>
                        <select id="widget-category"></select>
                    </label>
                    <label class="control">
                        <span>Search</span>
                        <input id="widget-search" placeholder="Type to filter" />
                    </label>
                </div>
            </div>
            <div id="widget-palette" class="widget-strip"></div>
        </section>

        <main class="canvas-row">
            <div class="canvas-header">
                <div>
                    <p class="section-kicker">Canvas</p>
                    <h2>Live Layout</h2>
                </div>
                <div class="canvas-meta">
                    <span id="canvas-size-chip" class="chip">—</span>
                    <span id="grid-chip" class="chip">Grid: On</span>
                    <span id="snap-chip" class="chip">Snap: Off</span>
                    <span class="chip">Safe Zone</span>
                    <label class="toggle">
                        <input id="grid-toggle" type="checkbox" checked />
                        <span>Show grid</span>
                    </label>
                    <label class="toggle">
                        <input id="snap-toggle" type="checkbox" />
                        <span>Align to grid</span>
                    </label>
                </div>
            </div>
            <div id="designer-canvas" class="designer-canvas"></div>
        </main>

        <footer class="footer-row">
            <div class="footer-header">
                <div>
                    <p class="section-kicker">Footer</p>
                    <h2>Data Preview</h2>
                </div>
                <div class="footer-meta">
                    <span id="selected-widget" class="footer-label">No widget selected</span>
                    <span id="selected-binding" class="footer-label muted">—</span>
                </div>
            </div>
            <pre id="preview-json">Select a widget to preview its data source.</pre>
        </footer>
    </div>
    <script src="/designer/ui/app.js"></script>
</body>
</html>
