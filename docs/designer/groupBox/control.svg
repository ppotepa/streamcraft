<svg xmlns="http://www.w3.org/2000/svg" width="520" height="300" viewBox="0 0 520 300">
  <defs>

    <style>
      .title { font: 600 16px 'Segoe UI', Arial, sans-serif; fill: #ffffff; }
      .text { font: 14px 'Segoe UI', Arial, sans-serif; fill: #1b1b1b; }
      .muted { font: 12px 'Segoe UI', Arial, sans-serif; fill: #5a5a5a; }
      .window { fill: #c0c0c0; stroke: #000; stroke-width: 2; }
      .titlebar { fill: #000080; }
      .panel { fill: #ededed; stroke: #9a9a9a; stroke-width: 1; }
      .inset { fill: #ffffff; stroke: #7d7d7d; stroke-width: 1; }
      .button { fill: #d7d7d7; stroke: #7d7d7d; stroke-width: 1; }
      .status { fill: #d6d6d6; stroke: #8a8a8a; stroke-width: 1; }
      .menu { fill: #e6e6e6; stroke: #9a9a9a; stroke-width: 1; }
      .accent { fill: #000080; }
    </style>
  </defs>
  <rect x="30" y="24" width="460" height="250" class="window" />
  <rect x="30" y="24" width="460" height="28" class="titlebar" />
  <text x="44" y="44" class="title">GroupBox Control</text>

  <!-- GroupBox with title -->
  <rect x="50" y="85" width="180" height="120" fill="none" stroke="#7d7d7d" stroke-width="1" />
  <rect x="60" y="75" width="90" height="20" fill="#c0c0c0" />
  <text x="65" y="90" class="text">Group Title</text>
  <rect x="70" y="115" width="16" height="16" class="inset" />
  <path d="M 73 123 L 77 127 L 83 118" fill="none" stroke="#000" stroke-width="2" />
  <text x="92" y="128" class="text">Option 1</text>
  <rect x="70" y="145" width="16" height="16" class="inset" />
  <text x="92" y="158" class="text">Option 2</text>
  <rect x="70" y="175" width="16" height="16" class="inset" />
  <text x="92" y="188" class="text">Option 3</text>
  
  <!-- GroupBox for form section -->
  <rect x="260" y="85" width="180" height="120" fill="none" stroke="#7d7d7d" stroke-width="1" />
  <rect x="270" y="75" width="110" height="20" fill="#c0c0c0" />
  <text x="275" y="90" class="text">Personal Info</text>
  <text x="275" y="115" class="muted">Name:</text>
  <rect x="275" y="125" width="150" height="24" class="inset" />
  <text x="275" y="160" class="muted">Email:</text>
  <rect x="275" y="170" width="150" height="24" class="inset" />
  
  <!-- Properties -->
  <text x="50" y="230" class="muted">Properties:</text>
  <text x="50" y="250" style="font: 12px 'Courier New'; fill: #1b1b1b;">title, border</text>

</svg>
