<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700">
  <defs>
    <style>
      .title { font: 600 16px 'Segoe UI', Arial, sans-serif; fill: #ffffff; }
      .text { font: 14px 'Segoe UI', Arial, sans-serif; fill: #1b1b1b; }
      .small { font: 12px 'Segoe UI', Arial, sans-serif; fill: #1b1b1b; }
      .muted { font: 12px 'Segoe UI', Arial, sans-serif; fill: #5a5a5a; }
      .window { fill: #c0c0c0; stroke: #000; stroke-width: 2; }
      .titlebar { fill: #000080; }
      .panel { fill: #ededed; stroke: #9a9a9a; stroke-width: 1; }
      .inset { fill: #ffffff; stroke: #7d7d7d; stroke-width: 1; }
      .button { fill: #d7d7d7; stroke: #7d7d7d; stroke-width: 1; }
      .label { font: 12px 'Segoe UI', Arial, sans-serif; fill: #1b1b1b; }
      .field { fill: #f8f8f8; stroke: #9a9a9a; stroke-width: 1; }
      .field-selected { fill: #000080; stroke: #9a9a9a; stroke-width: 1; }
      .field-text { font: 11px 'Courier New', monospace; fill: #1b1b1b; }
      .field-text-selected { font: 11px 'Courier New', monospace; fill: #ffffff; }
    </style>
  </defs>
  
  <!-- Window -->
  <rect x="20" y="20" width="960" height="660" class="window" />
  <rect x="20" y="20" width="960" height="28" class="titlebar" />
  <text x="34" y="40" class="title">Data Source Explorer</text>
  <rect x="968" y="24" width="8" height="8" fill="#ffffff" />
  
  <!-- Main Content Area -->
  <rect x="30" y="58" width="950" height="570" class="panel" />
  
  <!-- Source Selection Section -->
  <text x="40" y="80" class="muted">Source Selection</text>
  
  <!-- Category -->
  <text x="40" y="105" class="label">Category:</text>
  <rect x="180" y="92" width="250" height="24" class="inset" />
  <text x="190" y="110" class="small">Games</text>
  <polygon points="420,102 415,107 410,102" fill="#000" />
  
  <!-- Subcategory -->
  <text x="40" y="135" class="label">Subcategory:</text>
  <rect x="180" y="122" width="250" height="24" class="inset" />
  <text x="190" y="140" class="small">StarCraft 2</text>
  <polygon points="420,132 415,137 410,132" fill="#000" />
  
  <!-- Source -->
  <text x="40" y="165" class="label">Source:</text>
  <rect x="180" y="152" width="250" height="24" class="inset" />
  <text x="190" y="170" class="small">SC2 Pulse API</text>
  <polygon points="420,162 415,167 410,162" fill="#000" />
  
  <!-- Endpoint -->
  <text x="40" y="195" class="label">Endpoint:</text>
  <rect x="180" y="182" width="250" height="24" class="inset" />
  <text x="190" y="200" class="small">GET /player/:id</text>
  <polygon points="420,192 415,197 410,192" fill="#000" />
  
  <!-- Test Button -->
  <text x="40" y="225" class="label">Fetch Data:</text>
  <rect x="180" y="212" width="100" height="24" class="button" />
  <text x="205" y="230" class="text">Test</text>
  <text x="290" y="230" class="small">OK (200)</text>
  
  <!-- Fields and Preview Grid -->
  <line x1="30" y1="250" x2="980" y2="250" stroke="#9a9a9a" stroke-width="1" />
  
  <!-- Fields Panel -->
  <rect x="40" y="260" width="440" height="340" class="inset" />
  <rect x="40" y="260" width="440" height="24" fill="#d6d6d6" stroke="#9a9a9a" stroke-width="1" />
  <text x="50" y="277" class="text">Fields</text>
  
  <!-- Field List -->
  <rect x="45" y="289" width="430" height="22" class="field-selected" />
  <text x="55" y="304" class="field-text-selected">response.player.name</text>
  <text x="380" y="304" class="field-text-selected">string</text>
  
  <rect x="45" y="313" width="430" height="22" class="field" />
  <text x="55" y="328" class="field-text">response.player.id</text>
  <text x="380" y="328" class="field-text">number</text>
  
  <rect x="45" y="337" width="430" height="22" class="field" />
  <text x="55" y="352" class="field-text">response.player.race</text>
  <text x="380" y="352" class="field-text">string</text>
  
  <rect x="45" y="361" width="430" height="22" class="field" />
  <text x="55" y="376" class="field-text">response.player.mmr</text>
  <text x="380" y="376" class="field-text">number</text>
  
  <rect x="45" y="385" width="430" height="22" class="field" />
  <text x="55" y="400" class="field-text">response.player.wins</text>
  <text x="380" y="400" class="field-text">number</text>
  
  <rect x="45" y="409" width="430" height="22" class="field" />
  <text x="55" y="424" class="field-text">response.player.losses</text>
  <text x="380" y="424" class="field-text">number</text>
  
  <rect x="45" y="433" width="430" height="22" class="field" />
  <text x="55" y="448" class="field-text">response.timestamp</text>
  <text x="380" y="448" class="field-text">string</text>
  
  <!-- Preview Panel -->
  <rect x="490" y="260" width="480" height="340" class="inset" />
  <rect x="490" y="260" width="480" height="24" fill="#d6d6d6" stroke="#9a9a9a" stroke-width="1" />
  <text x="500" y="277" class="text">Preview</text>
  
  <!-- JSON Tree -->
  <text x="500" y="304" style="font: 11px 'Courier New'; fill: #1b1b1b;">{</text>
  <text x="520" y="322" style="font: 11px 'Courier New'; fill: #0066cc;">"player"</text>
  <text x="580" y="322" style="font: 11px 'Courier New'; fill: #1b1b1b;">: {</text>
  <text x="540" y="340" style="font: 11px 'Courier New'; fill: #0066cc;">"name"</text>
  <text x="590" y="340" style="font: 11px 'Courier New'; fill: #1b1b1b;">:</text>
  <text x="605" y="340" style="font: 11px 'Courier New'; fill: #a31515;">"Serral"</text>
  <text x="665" y="340" style="font: 11px 'Courier New'; fill: #1b1b1b;">,</text>
  <text x="540" y="358" style="font: 11px 'Courier New'; fill: #0066cc;">"id"</text>
  <text x="575" y="358" style="font: 11px 'Courier New'; fill: #1b1b1b;">:</text>
  <text x="605" y="358" style="font: 11px 'Courier New'; fill: #098658;">12345</text>
  <text x="645" y="358" style="font: 11px 'Courier New'; fill: #1b1b1b;">,</text>
  <text x="540" y="376" style="font: 11px 'Courier New'; fill: #0066cc;">"race"</text>
  <text x="585" y="376" style="font: 11px 'Courier New'; fill: #1b1b1b;">:</text>
  <text x="605" y="376" style="font: 11px 'Courier New'; fill: #a31515;">"Zerg"</text>
  <text x="655" y="376" style="font: 11px 'Courier New'; fill: #1b1b1b;">,</text>
  <text x="540" y="394" style="font: 11px 'Courier New'; fill: #0066cc;">"mmr"</text>
  <text x="580" y="394" style="font: 11px 'Courier New'; fill: #1b1b1b;">:</text>
  <text x="605" y="394" style="font: 11px 'Courier New'; fill: #098658;">7250</text>
  <text x="645" y="394" style="font: 11px 'Courier New'; fill: #1b1b1b;">,</text>
  <text x="540" y="412" style="font: 11px 'Courier New'; fill: #0066cc;">"wins"</text>
  <text x="585" y="412" style="font: 11px 'Courier New'; fill: #1b1b1b;">:</text>
  <text x="605" y="412" style="font: 11px 'Courier New'; fill: #098658;">1523</text>
  <text x="645" y="412" style="font: 11px 'Courier New'; fill: #1b1b1b;">,</text>
  <text x="540" y="430" style="font: 11px 'Courier New'; fill: #0066cc;">"losses"</text>
  <text x="600" y="430" style="font: 11px 'Courier New'; fill: #1b1b1b;">:</text>
  <text x="615" y="430" style="font: 11px 'Courier New'; fill: #098658;">892</text>
  <text x="520" y="448" style="font: 11px 'Courier New'; fill: #1b1b1b;">},</text>
  <text x="520" y="466" style="font: 11px 'Courier New'; fill: #0066cc;">"timestamp"</text>
  <text x="600" y="466" style="font: 11px 'Courier New'; fill: #1b1b1b;">:</text>
  <text x="615" y="466" style="font: 11px 'Courier New'; fill: #a31515;">"2026-02-02T10:30:00Z"</text>
  <text x="500" y="484" style="font: 11px 'Courier New'; fill: #1b1b1b;">}</text>
  
  <!-- Footer Section -->
  <rect x="30" y="628" width="950" height="50" fill="#d6d6d6" stroke="#9a9a9a" stroke-width="1" />
  
  <!-- Bind To -->
  <text x="40" y="650" class="label">Bind To:</text>
  <text x="180" y="650" class="small">lblStatus · Text</text>
  
  <!-- Path -->
  <text x="400" y="650" class="label">Path:</text>
  <rect x="470" y="637" width="280" height="24" class="inset" />
  <text x="480" y="655" class="small">response.player.name</text>
  
  <!-- Buttons -->
  <rect x="770" y="642" width="90" height="28" class="button" />
  <text x="795" y="661" class="text">Close</text>
  
  <rect x="870" y="642" width="90" height="28" class="button" />
  <text x="900" y="661" class="text">Bind</text>
</svg>
