<svg xmlns="http://www.w3.org/2000/svg" width="440" height="320" viewBox="0 0 440 320">
  <defs>
    <style>
      .title { font: 600 16px 'Segoe UI', Arial, sans-serif; fill: #ffffff; }
      .text { font: 14px 'Segoe UI', Arial, sans-serif; fill: #1b1b1b; }
      .small { font: 12px 'Segoe UI', Arial, sans-serif; fill: #1b1b1b; }
      .muted { font: 12px 'Segoe UI', Arial, sans-serif; fill: #5a5a5a; }
      .window { fill: #c0c0c0; stroke: #000; stroke-width: 2; }
      .titlebar { fill: #000080; }
      .panel { fill: #ededed; stroke: #9a9a9a; stroke-width: 1; }
      .inset { fill: #ffffff; stroke: #7d7d7d; stroke-width: 1; }
      .button { fill: #d7d7d7; stroke: #7d7d7d; stroke-width: 1; }
      .label { font: 12px 'Segoe UI', Arial, sans-serif; fill: #1b1b1b; }
    </style>
  </defs>
  
  <!-- Window -->
  <rect x="20" y="20" width="400" height="280" class="window" />
  <rect x="20" y="20" width="400" height="28" class="titlebar" />
  <text x="34" y="40" class="title">Text Style Editor</text>
  <rect x="408" y="24" width="8" height="8" fill="#ffffff" />
  
  <!-- Content Area -->
  <rect x="30" y="58" width="380" height="210" class="panel" />
  
  <!-- Text Shadow Section -->
  <text x="40" y="80" class="muted">Text Shadow Properties</text>
  
  <!-- Shadow X -->
  <text x="40" y="110" class="label">Shadow X:</text>
  <rect x="180" y="97" width="120" height="24" class="inset" />
  <text x="190" y="115" class="small">2</text>
  <text x="310" y="115" class="muted">(-20 to 20)</text>
  
  <!-- Shadow Y -->
  <text x="40" y="145" class="label">Shadow Y:</text>
  <rect x="180" y="132" width="120" height="24" class="inset" />
  <text x="190" y="150" class="small">2</text>
  <text x="310" y="150" class="muted">(-20 to 20)</text>
  
  <!-- Shadow Blur -->
  <text x="40" y="180" class="label">Shadow Blur:</text>
  <rect x="180" y="167" width="120" height="24" class="inset" />
  <text x="190" y="185" class="small">4</text>
  <text x="310" y="185" class="muted">(0 to 40)</text>
  
  <!-- Shadow Color -->
  <text x="40" y="215" class="label">Shadow Color:</text>
  <rect x="180" y="202" width="60" height="24" fill="#000000" stroke="#7d7d7d" stroke-width="1" />
  <text x="250" y="220" class="small">#000000</text>
  
  <!-- Preview -->
  <text x="40" y="250" class="muted">Preview:</text>
  <text x="180" y="250" style="font: 16px Arial; fill: #000; text-shadow: 2px 2px 4px #000000;">Sample Text</text>
  
  <!-- Close Button -->
  <rect x="315" y="234" width="80" height="28" class="button" />
  <text x="340" y="253" class="text">Close</text>
  
  <!-- Footer Info -->
  <text x="30" y="290" class="muted">Small dialog for editing text shadow effects on selected text elements</text>
</svg>
