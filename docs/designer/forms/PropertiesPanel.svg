<svg xmlns="http://www.w3.org/2000/svg" width="680" height="800" viewBox="0 0 680 800">
  <defs>
    <style>
      .title { font: 600 16px 'Segoe UI', Arial, sans-serif; fill: #ffffff; }
      .text { font: 14px 'Segoe UI', Arial, sans-serif; fill: #1b1b1b; }
      .small { font: 12px 'Segoe UI', Arial, sans-serif; fill: #1b1b1b; }
      .muted { font: 12px 'Segoe UI', Arial, sans-serif; fill: #5a5a5a; }
      .window { fill: #c0c0c0; stroke: #000; stroke-width: 2; }
      .titlebar { fill: #000080; }
      .panel { fill: #ededed; stroke: #9a9a9a; stroke-width: 1; }
      .inset { fill: #ffffff; stroke: #7d7d7d; stroke-width: 1; }
      .button { fill: #d7d7d7; stroke: #7d7d7d; stroke-width: 1; }
      .tab { fill: #c0c0c0; stroke: #7d7d7d; stroke-width: 1; }
      .tab-active { fill: #ededed; stroke: #7d7d7d; stroke-width: 1; }
      .label { font: 12px 'Segoe UI', Arial, sans-serif; fill: #1b1b1b; }
    </style>
  </defs>
  
  <!-- Window -->
  <rect x="20" y="20" width="640" height="760" class="window" />
  <rect x="20" y="20" width="640" height="28" class="titlebar" />
  <text x="34" y="40" class="title">Properties Panel</text>
  <rect x="648" y="24" width="8" height="8" fill="#ffffff" />
  
  <!-- Tab Strip -->
  <rect x="30" y="58" width="80" height="28" class="tab-active" />
  <text x="50" y="77" class="text">Basic</text>
  
  <rect x="110" y="58" width="80" height="28" class="tab" />
  <text x="125" y="77" class="text">Binding</text>
  
  <rect x="190" y="58" width="80" height="28" class="tab" />
  <text x="215" y="77" class="text">Text</text>
  
  <rect x="270" y="58" width="80" height="28" class="tab" />
  <text x="285" y="77" class="text">Worker</text>
  
  <rect x="350" y="58" width="80" height="28" class="tab" />
  <text x="365" y="77" class="text">Events</text>
  
  <!-- Tab Content Area -->
  <rect x="30" y="86" width="620" height="680" class="panel" />
  
  <!-- Basic Properties Section -->
  <text x="40" y="110" class="muted">Basic Properties</text>
  
  <!-- Type -->
  <text x="40" y="135" class="label">Type:</text>
  <rect x="180" y="122" width="200" height="24" class="inset" />
  <text x="190" y="140" class="small">text</text>
  
  <!-- Name -->
  <text x="40" y="165" class="label">Name:</text>
  <rect x="180" y="152" width="200" height="24" class="inset" />
  <text x="190" y="170" class="small">lblStatus</text>
  
  <!-- Position X -->
  <text x="40" y="195" class="label">X:</text>
  <rect x="180" y="182" width="90" height="24" class="inset" />
  <text x="190" y="200" class="small">120</text>
  
  <!-- Position Y -->
  <text x="300" y="195" class="label">Y:</text>
  <rect x="340" y="182" width="90" height="24" class="inset" />
  <text x="350" y="200" class="small">80</text>
  
  <!-- Width -->
  <text x="40" y="225" class="label">Width:</text>
  <rect x="180" y="212" width="90" height="24" class="inset" />
  <text x="190" y="230" class="small">200</text>
  
  <!-- Height -->
  <text x="300" y="225" class="label">Height:</text>
  <rect x="340" y="212" width="90" height="24" class="inset" />
  <text x="350" y="230" class="small">30</text>
  
  <!-- Type-Specific Properties -->
  <text x="40" y="265" class="muted">Type-Specific Properties</text>
  
  <!-- Label Text -->
  <text x="40" y="290" class="label">Label:</text>
  <rect x="180" y="277" width="200" height="24" class="inset" />
  <text x="190" y="295" class="small">Ready</text>
  
  <!-- Text Color -->
  <text x="40" y="320" class="label">Text Color:</text>
  <rect x="180" y="307" width="60" height="24" fill="#000000" stroke="#7d7d7d" stroke-width="1" />
  <text x="250" y="325" class="small">#000000</text>
  
  <!-- Font Family -->
  <text x="40" y="350" class="label">Font Family:</text>
  <rect x="180" y="337" width="200" height="24" class="inset" />
  <text x="190" y="355" class="small">Arial</text>
  
  <!-- Font Size -->
  <text x="40" y="380" class="label">Font Size:</text>
  <rect x="180" y="367" width="90" height="24" class="inset" />
  <text x="190" y="385" class="small">14</text>
  
  <!-- Font Weight -->
  <text x="300" y="380" class="label">Weight:</text>
  <rect x="370" y="367" width="120" height="24" class="inset" />
  <text x="380" y="385" class="small">normal</text>
  
  <!-- Font Style -->
  <text x="40" y="410" class="label">Style:</text>
  <rect x="180" y="397" width="120" height="24" class="inset" />
  <text x="190" y="415" class="small">normal</text>
  
  <!-- Text Transform -->
  <text x="40" y="440" class="label">Transform:</text>
  <rect x="180" y="427" width="120" height="24" class="inset" />
  <text x="190" y="445" class="small">none</text>
  
  <!-- Letter Spacing -->
  <text x="40" y="470" class="label">Letter Spacing:</text>
  <rect x="180" y="457" width="90" height="24" class="inset" />
  <text x="190" y="475" class="small">0</text>
  
  <!-- Action Buttons -->
  <rect x="40" y="500" width="140" height="28" class="button" />
  <text x="60" y="519" class="text">Text Style...</text>
  
  <rect x="190" y="500" width="140" height="28" class="button" />
  <text x="210" y="519" class="text">Data Binding...</text>
  
  <!-- Binding Status -->
  <text x="40" y="555" class="muted">Data Binding</text>
  <text x="40" y="575" class="label">Status:</text>
  <text x="180" y="575" class="small">Not bound</text>
  
  <!-- Worker Configuration -->
  <text x="40" y="615" class="muted">Worker Configuration</text>
  
  <!-- Auto Refresh -->
  <rect x="40" y="630" width="16" height="16" class="inset" />
  <text x="65" y="643" class="label">Auto-refresh enabled</text>
  
  <!-- Interval -->
  <text x="40" y="670" class="label">Interval (ms):</text>
  <rect x="180" y="657" width="120" height="24" class="inset" />
  <text x="190" y="675" class="small">1000</text>
  
  <!-- Worker Action Buttons -->
  <rect x="40" y="695" width="140" height="28" class="button" />
  <text x="60" y="714" class="text">Triggers...</text>
  
  <rect x="190" y="695" width="140" height="28" class="button" />
  <text x="210" y="714" class="text">Worker Setup...</text>
  
  <!-- Footer Info -->
  <text x="40" y="745" class="muted">Properties panel with 5 tabs: Basic, Binding, Text, Worker, Events</text>
  <text x="40" y="765" class="muted">Dynamic form based on selected canvas item type</text>
</svg>
