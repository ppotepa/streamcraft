<svg xmlns="http://www.w3.org/2000/svg" width="520" height="300" viewBox="0 0 520 300">
  <defs>

    <style>
      .title { font: 600 16px 'Segoe UI', Arial, sans-serif; fill: #ffffff; }
      .text { font: 14px 'Segoe UI', Arial, sans-serif; fill: #1b1b1b; }
      .muted { font: 12px 'Segoe UI', Arial, sans-serif; fill: #5a5a5a; }
      .window { fill: #c0c0c0; stroke: #000; stroke-width: 2; }
      .titlebar { fill: #000080; }
      .panel { fill: #ededed; stroke: #9a9a9a; stroke-width: 1; }
      .inset { fill: #ffffff; stroke: #7d7d7d; stroke-width: 1; }
      .button { fill: #d7d7d7; stroke: #7d7d7d; stroke-width: 1; }
      .status { fill: #d6d6d6; stroke: #8a8a8a; stroke-width: 1; }
      .menu { fill: #e6e6e6; stroke: #9a9a9a; stroke-width: 1; }
      .accent { fill: #000080; }
    </style>
  </defs>
  <rect x="30" y="24" width="460" height="250" class="window" />
  <rect x="30" y="24" width="460" height="28" class="titlebar" />
  <text x="44" y="44" class="title">DiagnosticsPanel - Log Viewer</text>

  <!-- Diagnostics panel -->
  <rect x="50" y="70" width="400" height="200" class="panel" />
  <rect x="50" y="70" width="400" height="24" class="menu" />
  <text x="60" y="88" class="text">Diagnostics</text>
  
  <!-- Tabs -->
  <rect x="140" y="74" width="60" height="20" class="accent" />
  <text x="154" y="90" class="title">All</text>
  <rect x="200" y="74" width="70" height="20" class="button" />
  <text x="210" y="90" class="text">Errors</text>
  <rect x="270" y="74" width="80" height="20" class="button" />
  <text x="275" y="90" class="text">Warnings</text>
  
  <!-- Log entries -->
  <rect x="55" y="100" width="390" height="165" class="inset" />
  
  <!-- Error entry -->
  <text x="65" y="118" style="fill: #dc3545; font: 12px 'Segoe UI';">ERROR</text>
  <text x="115" y="118" class="text">12:34:01</text>
  <text x="180" y="118" class="text">Failed to load component</text>
  
  <!-- Warning entry -->
  <text x="65" y="138" style="fill: #ffc107; font: 12px 'Segoe UI';">WARN</text>
  <text x="115" y="138" class="text">12:34:15</text>
  <text x="180" y="138" class="text">Missing property binding</text>
  
  <!-- Info entry -->
  <text x="65" y="158" style="fill: #17a2b8; font: 12px 'Segoe UI';">INFO</text>
  <text x="115" y="158" class="text">12:34:32</text>
  <text x="180" y="158" class="text">Component loaded successfully</text>
  
  <!-- Debug entry -->
  <text x="65" y="178" class="muted">DEBUG</text>
  <text x="115" y="178" class="text">12:34:45</text>
  <text x="180" y="178" class="text">Rendering view</text>
  
  <!-- Selected entry -->
  <rect x="55" y="185" width="390" height="20" class="accent" />
  <text x="65" y="199" class="title">ERROR</text>
  <text x="115" y="199" class="title">12:35:01</text>
  <text x="180" y="199" class="title">Validation failed</text>
  
  <text x="65" y="218" class="text">Button 'Submit' requires onClick handler</text>
  <text x="65" y="235" class="muted">at Form.validate (line 42)</text>
  
  <!-- Properties -->
  <text x="50" y="285" style="font: 12px 'Courier New'; fill: #1b1b1b;">entries: LogEntry[], filter, autoScroll, maxEntries</text>

</svg>
