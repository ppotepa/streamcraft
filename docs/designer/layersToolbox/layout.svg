<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640">
  <defs>
    <style>
      .title { font: 600 16px 'Segoe UI', Arial, sans-serif; fill: #ffffff; }
      .text { font: 14px 'Segoe UI', Arial, sans-serif; fill: #1b1b1b; }
      .muted { font: 12px 'Segoe UI', Arial, sans-serif; fill: #5a5a5a; }
      .window { fill: #c0c0c0; stroke: #000; stroke-width: 2; }
      .titlebar { fill: #000080; }
      .row { fill: #e9e9e9; stroke: #b0b0b0; stroke-width: 1; }
      .rowSelected { fill: #cdddfb; stroke: #7fa2e6; stroke-width: 1; }
      .thumb { fill: #ffffff; stroke: #707070; stroke-width: 1; }
      .icon { font: 12px 'Segoe UI Symbol', Arial, sans-serif; }
      .hint { font: 12px 'Segoe UI', Arial, sans-serif; fill: #2f2f2f; }
    </style>
  </defs>

  <!-- Window -->
  <rect x="60" y="40" width="780" height="560" class="window" />
  <rect x="60" y="40" width="780" height="28" class="titlebar" />
  <text x="74" y="60" class="title">Layers</text>
  <text x="800" y="60" class="title">_  □  X</text>

  <!-- Toolbar -->
  <text x="80" y="98" class="text">Search:</text>
  <rect x="150" y="82" width="360" height="22" fill="#fff" stroke="#707070" />
  <text x="160" y="98" class="muted">Filter layers</text>
  <rect x="520" y="82" width="80" height="22" fill="#d7d7d7" stroke="#707070" />
  <text x="540" y="98" class="text">Lock</text>

  <!-- List Header Line -->
  <line x1="70" y1="118" x2="830" y2="118" stroke="#808080" />

  <!-- Row 1 -->
  <rect x="80" y="128" width="740" height="44" class="row" />
  <rect x="90" y="140" width="16" height="16" fill="#fff" stroke="#707070" />
  <rect x="118" y="136" width="28" height="28" class="thumb" />
  <text x="125" y="155" class="text">T</text>
  <text x="160" y="154" class="text">Text1</text>
  <text x="300" y="154" class="muted">(Text)</text>
  <text x="720" y="154" class="icon">👁</text>
  <text x="748" y="154" class="icon">🔒</text>

  <!-- Row 2 -->
  <rect x="80" y="176" width="740" height="44" class="row" />
  <rect x="90" y="188" width="16" height="16" fill="#fff" stroke="#707070" />
  <rect x="118" y="184" width="28" height="28" class="thumb" />
  <text x="122" y="203" class="text">🖼</text>
  <text x="160" y="202" class="text">Image2</text>
  <text x="300" y="202" class="muted">(Image)</text>
  <text x="720" y="202" class="icon">👁</text>
  <text x="748" y="202" class="icon">🔒</text>

  <!-- Row 3 (selected) -->
  <rect x="80" y="224" width="740" height="44" class="rowSelected" />
  <rect x="90" y="236" width="16" height="16" fill="#fff" stroke="#707070" />
  <rect x="118" y="232" width="28" height="28" class="thumb" />
  <text x="123" y="251" class="text">▮▮</text>
  <text x="160" y="250" class="text">Progress3</text>
  <text x="300" y="250" class="muted">(Progress)</text>
  <text x="720" y="250" class="icon">👁</text>
  <text x="748" y="250" class="icon">🔒</text>

  <!-- Row 4 -->
  <rect x="80" y="272" width="740" height="44" class="row" />
  <rect x="90" y="284" width="16" height="16" fill="#fff" stroke="#707070" />
  <rect x="118" y="280" width="28" height="28" class="thumb" />
  <text x="126" y="299" class="text">▢</text>
  <text x="160" y="298" class="text">Rect4</text>
  <text x="300" y="298" class="muted">(Shape)</text>
  <text x="720" y="298" class="icon">👁</text>
  <text x="748" y="298" class="icon">🔒</text>

  <!-- Row 5 -->
  <rect x="80" y="320" width="740" height="44" class="row" />
  <rect x="90" y="332" width="16" height="16" fill="#fff" stroke="#707070" />
  <rect x="118" y="328" width="28" height="28" class="thumb" />
  <text x="124" y="347" class="text">──</text>
  <text x="160" y="346" class="text">Line5</text>
  <text x="300" y="346" class="muted">(Line)</text>
  <text x="720" y="346" class="icon">👁</text>
  <text x="748" y="346" class="icon">🔒</text>

  <!-- Footer hint -->
  <line x1="70" y1="380" x2="830" y2="380" stroke="#808080" />
  <text x="80" y="404" class="hint">Drag rows to reorder (top = frontmost)</text>
</svg>
