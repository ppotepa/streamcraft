<svg xmlns="http://www.w3.org/2000/svg" width="520" height="300" viewBox="0 0 520 300">
  <defs>

    <style>
      .title { font: 600 16px 'Segoe UI', Arial, sans-serif; fill: #ffffff; }
      .text { font: 14px 'Segoe UI', Arial, sans-serif; fill: #1b1b1b; }
      .muted { font: 12px 'Segoe UI', Arial, sans-serif; fill: #5a5a5a; }
      .window { fill: #c0c0c0; stroke: #000; stroke-width: 2; }
      .titlebar { fill: #000080; }
      .panel { fill: #ededed; stroke: #9a9a9a; stroke-width: 1; }
      .inset { fill: #ffffff; stroke: #7d7d7d; stroke-width: 1; }
      .button { fill: #d7d7d7; stroke: #7d7d7d; stroke-width: 1; }
      .status { fill: #d6d6d6; stroke: #8a8a8a; stroke-width: 1; }
      .menu { fill: #e6e6e6; stroke: #9a9a9a; stroke-width: 1; }
      .accent { fill: #000080; }
    </style>
  </defs>
  <rect x="30" y="24" width="460" height="250" class="window" />
  <rect x="30" y="24" width="460" height="28" class="titlebar" />
  <text x="44" y="44" class="title">RadioButton Control</text>

  <!-- Unselected -->
  <circle cx="60" cy="82" r="10" class="inset" />
  <text x="80" y="88" class="text">Unselected</text>
  
  <!-- Selected -->
  <circle cx="220" cy="82" r="10" class="inset" />
  <circle cx="220" cy="82" r="5" class="accent" />
  <text x="240" y="88" class="text">Selected</text>
  
  <!-- Disabled Unselected -->
  <circle cx="60" cy="120" r="10" fill="#e9ecef" stroke="#ced4da" stroke-width="1" />
  <text x="80" y="126" style="fill: #6c757d; font: 14px 'Segoe UI';">Disabled Unselected</text>
  
  <!-- Disabled Selected -->
  <circle cx="280" cy="120" r="10" fill="#e9ecef" stroke="#ced4da" stroke-width="1" />
  <circle cx="280" cy="120" r="5" fill="#a0a0a0" />
  <text x="300" y="126" style="fill: #6c757d; font: 14px 'Segoe UI';">Disabled Selected</text>
  
  <!-- Group Example -->
  <text x="50" y="160" class="muted">Radio Group:</text>
  <circle cx="60" cy="180" r="10" class="inset" />
  <circle cx="60" cy="180" r="5" class="accent" />
  <text x="80" y="186" class="text">Option A</text>
  
  <circle cx="60" cy="205" r="10" class="inset" />
  <text x="80" y="211" class="text">Option B</text>
  
  <circle cx="220" cy="180" r="10" class="inset" />
  <text x="240" y="186" class="text">Option C</text>
  
  <!-- Properties -->
  <text x="50" y="235" class="muted">Properties:</text>
  <text x="50" y="255" style="font: 12px 'Courier New'; fill: #1b1b1b;">checked, label, disabled, group</text>
  <text x="50" y="273" style="font: 12px 'Courier New'; fill: #1b1b1b;">onChange, value</text>

</svg>
