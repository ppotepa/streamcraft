<svg xmlns="http://www.w3.org/2000/svg" width="520" height="300" viewBox="0 0 520 300">
  <defs>

    <style>
      .title { font: 600 16px 'Segoe UI', Arial, sans-serif; fill: #ffffff; }
      .text { font: 14px 'Segoe UI', Arial, sans-serif; fill: #1b1b1b; }
      .muted { font: 12px 'Segoe UI', Arial, sans-serif; fill: #5a5a5a; }
      .window { fill: #c0c0c0; stroke: #000; stroke-width: 2; }
      .titlebar { fill: #000080; }
      .panel { fill: #ededed; stroke: #9a9a9a; stroke-width: 1; }
      .inset { fill: #ffffff; stroke: #7d7d7d; stroke-width: 1; }
      .button { fill: #d7d7d7; stroke: #7d7d7d; stroke-width: 1; }
      .status { fill: #d6d6d6; stroke: #8a8a8a; stroke-width: 1; }
      .menu { fill: #e6e6e6; stroke: #9a9a9a; stroke-width: 1; }
      .accent { fill: #000080; }
    </style>
  </defs>
  <rect x="30" y="24" width="460" height="250" class="window" />
  <rect x="30" y="24" width="460" height="28" class="titlebar" />
  <text x="44" y="44" class="title">Grid Layout</text>

  <!-- Grid with cells -->
  <rect x="50" y="70" width="400" height="200" class="panel" />
  
  <!-- Grid lines -->
  <line x1="183" y1="70" x2="183" y2="270" stroke="#7d7d7d" stroke-width="1" />
  <line x1="316" y1="70" x2="316" y2="270" stroke="#7d7d7d" stroke-width="1" />
  <line x1="50" y1="120" x2="450" y2="120" stroke="#7d7d7d" stroke-width="1" />
  <line x1="50" y1="170" x2="450" y2="170" stroke="#7d7d7d" stroke-width="1" />
  <line x1="50" y1="220" x2="450" y2="220" stroke="#7d7d7d" stroke-width="1" />
  
  <!-- Cell content -->
  <rect x="60" y="80" width="100" height="30" class="button" />
  <text x="95" y="100" class="text">Cell 1,1</text>
  
  <rect x="195" y="80" width="110" height="30" class="button" />
  <text x="232" y="100" class="text">Cell 1,2</text>
  
  <rect x="60" y="130" width="100" height="80" class="inset" />
  <text x="85" y="175" class="text">Cell 2,1</text>
  
  <rect x="195" y="130" width="110" height="30" class="button" />
  <text x="232" y="150" class="text">Cell 2,2</text>
  
  <rect x="328" y="80" width="110" height="130" class="panel" />
  <text x="360" y="150" class="text">Span 2x2</text>
  
  <!-- Properties -->
  <text x="50" y="285" style="font: 12px 'Courier New'; fill: #1b1b1b;">rows, columns, columnSpan, rowSpan, gap</text>

</svg>
