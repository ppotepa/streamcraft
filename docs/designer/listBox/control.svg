<svg xmlns="http://www.w3.org/2000/svg" width="520" height="300" viewBox="0 0 520 300">
  <defs>

    <style>
      .title { font: 600 16px 'Segoe UI', Arial, sans-serif; fill: #ffffff; }
      .text { font: 14px 'Segoe UI', Arial, sans-serif; fill: #1b1b1b; }
      .muted { font: 12px 'Segoe UI', Arial, sans-serif; fill: #5a5a5a; }
      .window { fill: #c0c0c0; stroke: #000; stroke-width: 2; }
      .titlebar { fill: #000080; }
      .panel { fill: #ededed; stroke: #9a9a9a; stroke-width: 1; }
      .inset { fill: #ffffff; stroke: #7d7d7d; stroke-width: 1; }
      .button { fill: #d7d7d7; stroke: #7d7d7d; stroke-width: 1; }
      .status { fill: #d6d6d6; stroke: #8a8a8a; stroke-width: 1; }
      .menu { fill: #e6e6e6; stroke: #9a9a9a; stroke-width: 1; }
      .accent { fill: #000080; }
    </style>
  </defs>
  <rect x="30" y="24" width="460" height="250" class="window" />
  <rect x="30" y="24" width="460" height="28" class="titlebar" />
  <text x="44" y="44" class="title">ListBox Control</text>

  <!-- Single selection -->
  <rect x="50" y="70" width="180" height="120" class="inset" />
  <text x="55" y="88" class="text">Item 1</text>
  <rect x="50" y="95" width="180" height="20" class="accent" />
  <text x="55" y="110" class="title">Item 2</text>
  <text x="55" y="132" class="text">Item 3</text>
  <text x="55" y="152" class="text">Item 4</text>
  <text x="55" y="172" class="text">Item 5</text>
  <text x="240" y="130" class="muted">Single select</text>
  
  <!-- Multi-selection -->
  <rect x="50" y="205" width="180" height="100" class="inset" />
  <rect x="50" y="205" width="180" height="20" class="accent" />
  <text x="55" y="220" class="title">Item 1</text>
  <text x="55" y="240" class="text">Item 2</text>
  <rect x="50" y="245" width="180" height="20" class="accent" />
  <text x="55" y="260" class="title">Item 3</text>
  <text x="55" y="280" class="text">Item 4</text>
  <text x="240" y="255" class="muted">Multi-select</text>
  
  <!-- Properties -->
  <text x="320" y="285" style="font: 12px 'Courier New'; fill: #1b1b1b;">items, selectedIndices, multiSelect, visibleRows</text>

</svg>
