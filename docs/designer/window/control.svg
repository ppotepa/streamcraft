<svg xmlns="http://www.w3.org/2000/svg" width="520" height="300" viewBox="0 0 520 300">
  <defs>

    <style>
      .title { font: 600 16px 'Segoe UI', Arial, sans-serif; fill: #ffffff; }
      .text { font: 14px 'Segoe UI', Arial, sans-serif; fill: #1b1b1b; }
      .muted { font: 12px 'Segoe UI', Arial, sans-serif; fill: #5a5a5a; }
      .window { fill: #c0c0c0; stroke: #000; stroke-width: 2; }
      .titlebar { fill: #000080; }
      .panel { fill: #ededed; stroke: #9a9a9a; stroke-width: 1; }
      .inset { fill: #ffffff; stroke: #7d7d7d; stroke-width: 1; }
      .button { fill: #d7d7d7; stroke: #7d7d7d; stroke-width: 1; }
      .status { fill: #d6d6d6; stroke: #8a8a8a; stroke-width: 1; }
      .menu { fill: #e6e6e6; stroke: #9a9a9a; stroke-width: 1; }
      .accent { fill: #000080; }
    </style>
  </defs>
  <rect x="30" y="24" width="460" height="250" class="window" />
  <rect x="30" y="24" width="460" height="28" class="titlebar" />
  <text x="44" y="44" class="title">Window Control</text>

  <!-- Normal window -->
  <rect x="60" y="70" width="200" height="140" class="window" />
  <rect x="60" y="70" width="200" height="24" class="titlebar" />
  <text x="72" y="88" class="title">Window Title</text>
  <rect x="230" y="74" width="12" height="12" class="button" />
  <text x="232" y="84" style="font: 10px 'Segoe UI'; fill: #1b1b1b;">_</text>
  <rect x="244" y="74" width="12" height="12" class="button" />
  <text x="246" y="84" style="font: 10px 'Segoe UI'; fill: #1b1b1b;">□</text>
  <rect x="232" y="105" width="18" height="12" class="button" />
  <text x="237" y="114" style="font: 9px 'Segoe UI'; fill: #1b1b1b;">X</text>
  <rect x="70" y="105" width="80" height="28" class="button" />
  <text x="98" y="124" class="text">Content</text>
  <text x="270" y="140" class="muted">Normal</text>
  
  <!-- Modal dialog -->
  <rect x="60" y="225" width="180" height="40" class="window" />
  <rect x="60" y="225" width="180" height="20" class="titlebar" />
  <text x="70" y="240" style="font: 12px 'Segoe UI'; fill: #fff;">Dialog</text>
  <rect x="220" y="228" width="14" height="14" class="button" />
  <text x="223" y="239" style="font: 10px 'Segoe UI'; fill: #1b1b1b;">X</text>
  <text x="250" y="250" class="muted">Modal</text>
  
  <!-- Properties -->
  <text x="290" y="250" style="font: 12px 'Courier New'; fill: #1b1b1b;">title, draggable, closable</text>
  <text x="290" y="268" style="font: 12px 'Courier New'; fill: #1b1b1b;">minimizable, maximizable, modal</text>

</svg>
