<svg xmlns="http://www.w3.org/2000/svg" width="520" height="300" viewBox="0 0 520 300">
  <defs>

    <style>
      .title { font: 600 16px 'Segoe UI', Arial, sans-serif; fill: #ffffff; }
      .text { font: 14px 'Segoe UI', Arial, sans-serif; fill: #1b1b1b; }
      .muted { font: 12px 'Segoe UI', Arial, sans-serif; fill: #5a5a5a; }
      .window { fill: #c0c0c0; stroke: #000; stroke-width: 2; }
      .titlebar { fill: #000080; }
      .panel { fill: #ededed; stroke: #9a9a9a; stroke-width: 1; }
      .inset { fill: #ffffff; stroke: #7d7d7d; stroke-width: 1; }
      .button { fill: #d7d7d7; stroke: #7d7d7d; stroke-width: 1; }
      .status { fill: #d6d6d6; stroke: #8a8a8a; stroke-width: 1; }
      .menu { fill: #e6e6e6; stroke: #9a9a9a; stroke-width: 1; }
      .accent { fill: #000080; }
    </style>
  </defs>
  <rect x="30" y="24" width="460" height="250" class="window" />
  <rect x="30" y="24" width="460" height="28" class="titlebar" />
  <text x="44" y="44" class="title">TrackBar Control</text>

  <!-- Horizontal -->
  <rect x="50" y="75" width="280" height="4" fill="#7d7d7d" />
  <rect x="150" y="65" width="16" height="24" class="button" />
  <text x="340" y="80" class="muted">Horizontal</text>
  
  <!-- Horizontal with ticks -->
  <rect x="50" y="115" width="280" height="4" fill="#7d7d7d" />
  <rect x="210" y="105" width="16" height="24" class="button" />
  <line x1="50" y1="130" x2="50" y2="135" stroke="#7d7d7d" stroke-width="1" />
  <line x1="120" y1="130" x2="120" y2="135" stroke="#7d7d7d" stroke-width="1" />
  <line x1="190" y1="130" x2="190" y2="135" stroke="#7d7d7d" stroke-width="1" />
  <line x1="260" y1="130" x2="260" y2="135" stroke="#7d7d7d" stroke-width="1" />
  <line x1="330" y1="130" x2="330" y2="135" stroke="#7d7d7d" stroke-width="1" />
  <text x="340" y="120" class="muted">With ticks</text>
  
  <!-- Vertical -->
  <rect x="418" y="65" width="4" height="150" fill="#7d7d7d" />
  <rect x="410" y="140" width="20" height="16" class="button" />
  <text x="440" y="145" class="muted">Vertical</text>
  
  <!-- Properties -->
  <text x="50" y="235" class="muted">Properties:</text>
  <text x="50" y="255" style="font: 12px 'Courier New'; fill: #1b1b1b;">value, minimum, maximum, orientation, tickFrequency, showTicks</text>

</svg>
