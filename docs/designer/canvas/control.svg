<svg xmlns="http://www.w3.org/2000/svg" width="520" height="300" viewBox="0 0 520 300">
  <defs>

    <style>
      .title { font: 600 16px 'Segoe UI', Arial, sans-serif; fill: #ffffff; }
      .text { font: 14px 'Segoe UI', Arial, sans-serif; fill: #1b1b1b; }
      .muted { font: 12px 'Segoe UI', Arial, sans-serif; fill: #5a5a5a; }
      .window { fill: #c0c0c0; stroke: #000; stroke-width: 2; }
      .titlebar { fill: #000080; }
      .panel { fill: #ededed; stroke: #9a9a9a; stroke-width: 1; }
      .inset { fill: #ffffff; stroke: #7d7d7d; stroke-width: 1; }
      .button { fill: #d7d7d7; stroke: #7d7d7d; stroke-width: 1; }
      .status { fill: #d6d6d6; stroke: #8a8a8a; stroke-width: 1; }
      .menu { fill: #e6e6e6; stroke: #9a9a9a; stroke-width: 1; }
      .accent { fill: #000080; }
    </style>
  </defs>
  <rect x="30" y="24" width="460" height="250" class="window" />
  <rect x="30" y="24" width="460" height="28" class="titlebar" />
  <text x="44" y="44" class="title">Canvas Drawing</text>

  <!-- Canvas with drawings -->
  <rect x="50" y="70" width="400" height="200" fill="#ffffff" stroke="#7d7d7d" stroke-width="2" />
  
  <!-- Example shapes -->
  <rect x="70" y="90" width="60" height="40" fill="#ffd700" stroke="#ff8c00" stroke-width="2" />
  <circle cx="180" cy="120" r="25" fill="#87ceeb" stroke="#4682b4" stroke-width="2" />
  <path d="M 250 110 L 280 150 L 220 150 Z" fill="#90ee90" stroke="#228b22" stroke-width="2" />
  <line x1="320" y1="90" x2="400" y2="160" stroke="#dc143c" stroke-width="3" />
  <text x="80" y="190" style="font: 16px 'Segoe UI'; fill: #1b1b1b;">Canvas Text</text>
  <path d="M 320 180 Q 360 160, 400 180" fill="none" stroke="#800080" stroke-width="2" />
  
  <!-- Properties -->
  <text x="50" y="285" style="font: 12px 'Courier New'; fill: #1b1b1b;">2D drawing context, paths, shapes, text, images</text>

</svg>
