<svg xmlns="http://www.w3.org/2000/svg" width="520" height="300" viewBox="0 0 520 300">
  <defs>

    <style>
      .title { font: 600 16px 'Segoe UI', Arial, sans-serif; fill: #ffffff; }
      .text { font: 14px 'Segoe UI', Arial, sans-serif; fill: #1b1b1b; }
      .muted { font: 12px 'Segoe UI', Arial, sans-serif; fill: #5a5a5a; }
      .window { fill: #c0c0c0; stroke: #000; stroke-width: 2; }
      .titlebar { fill: #000080; }
      .panel { fill: #ededed; stroke: #9a9a9a; stroke-width: 1; }
      .inset { fill: #ffffff; stroke: #7d7d7d; stroke-width: 1; }
      .button { fill: #d7d7d7; stroke: #7d7d7d; stroke-width: 1; }
      .status { fill: #d6d6d6; stroke: #8a8a8a; stroke-width: 1; }
      .menu { fill: #e6e6e6; stroke: #9a9a9a; stroke-width: 1; }
      .accent { fill: #000080; }
    </style>
  </defs>
  <rect x="30" y="24" width="460" height="250" class="window" />
  <rect x="30" y="24" width="460" height="28" class="titlebar" />
  <text x="44" y="44" class="title">MenuBar Control</text>

  <!-- Menu bar -->
  <rect x="50" y="70" width="400" height="28" class="menu" />
  <text x="60" y="90" class="text">File</text>
  <text x="100" y="90" class="text">Edit</text>
  <text x="140" y="90" class="text">View</text>
  <text x="185" y="90" class="text">Tools</text>
  <text x="235" y="90" class="text">Help</text>
  
  <!-- Open File menu -->
  <rect x="50" y="98" width="150" height="120" class="inset" />
  <rect x="50" y="98" width="150" height="22" class="accent" />
  <text x="60" y="114" class="title">New</text>
  <text x="130" y="114" class="title">Ctrl+N</text>
  <text x="60" y="134" class="text">Open...</text>
  <text x="120" y="134" class="text">Ctrl+O</text>
  <text x="60" y="154" class="text">Save</text>
  <text x="125" y="154" class="text">Ctrl+S</text>
  <line x1="50" y1="160" x2="200" y2="160" stroke="#7d7d7d" stroke-width="1" />
  <text x="60" y="178" class="text">Exit</text>
  
  <!-- Hover state -->
  <rect x="250" y="70" width="40" height="28" class="accent" />
  <text x="255" y="90" class="title">Edit</text>
  <text x="300" y="90" class="muted">Hover state</text>
  
  <!-- Properties -->
  <text x="50" y="235" class="muted">Properties:</text>
  <text x="50" y="255" style="font: 12px 'Courier New'; fill: #1b1b1b;">items: MenuItem[]</text>

</svg>
