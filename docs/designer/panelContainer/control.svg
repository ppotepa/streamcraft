<svg xmlns="http://www.w3.org/2000/svg" width="520" height="300" viewBox="0 0 520 300">
  <defs>

    <style>
      .title { font: 600 16px 'Segoe UI', Arial, sans-serif; fill: #ffffff; }
      .text { font: 14px 'Segoe UI', Arial, sans-serif; fill: #1b1b1b; }
      .muted { font: 12px 'Segoe UI', Arial, sans-serif; fill: #5a5a5a; }
      .window { fill: #c0c0c0; stroke: #000; stroke-width: 2; }
      .titlebar { fill: #000080; }
      .panel { fill: #ededed; stroke: #9a9a9a; stroke-width: 1; }
      .inset { fill: #ffffff; stroke: #7d7d7d; stroke-width: 1; }
      .button { fill: #d7d7d7; stroke: #7d7d7d; stroke-width: 1; }
      .status { fill: #d6d6d6; stroke: #8a8a8a; stroke-width: 1; }
      .menu { fill: #e6e6e6; stroke: #9a9a9a; stroke-width: 1; }
      .accent { fill: #000080; }
    </style>
  </defs>
  <rect x="30" y="24" width="460" height="250" class="window" />
  <rect x="30" y="24" width="460" height="28" class="titlebar" />
  <text x="44" y="44" class="title">PanelContainer - Multiple Panels</text>

  <!-- Horizontal panel container -->
  <rect x="50" y="70" width="400" height="100" class="panel" />
  <rect x="55" y="75" width="125" height="90" class="inset" />
  <text x="100" y="125" class="text">Panel 1</text>
  <rect x="185" y="75" width="125" height="90" class="inset" />
  <text x="230" y="125" class="text">Panel 2</text>
  <rect x="315" y="75" width="130" height="90" class="inset" />
  <text x="360" y="125" class="text">Panel 3</text>
  <text x="460" y="120" class="muted">Horizontal</text>
  
  <!-- Vertical panel container -->
  <rect x="50" y="185" width="120" height="90" class="panel" />
  <rect x="55" y="190" width="110" height="25" class="inset" />
  <text x="95" y="207" class="text">Panel 1</text>
  <rect x="55" y="220" width="110" height="25" class="inset" />
  <text x="95" y="237" class="text">Panel 2</text>
  <rect x="55" y="250" width="110" height="20" class="inset" />
  <text x="95" y="264" class="text">Panel 3</text>
  <text x="180" y="235" class="muted">Vertical</text>
  
  <!-- Properties -->
  <text x="250" y="285" style="font: 12px 'Courier New'; fill: #1b1b1b;">orientation: horizontal | vertical, resizable</text>

</svg>
