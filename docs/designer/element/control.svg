<svg xmlns="http://www.w3.org/2000/svg" width="520" height="300" viewBox="0 0 520 300">
  <defs>

    <style>
      .title { font: 600 16px 'Segoe UI', Arial, sans-serif; fill: #ffffff; }
      .text { font: 14px 'Segoe UI', Arial, sans-serif; fill: #1b1b1b; }
      .muted { font: 12px 'Segoe UI', Arial, sans-serif; fill: #5a5a5a; }
      .window { fill: #c0c0c0; stroke: #000; stroke-width: 2; }
      .titlebar { fill: #000080; }
      .panel { fill: #ededed; stroke: #9a9a9a; stroke-width: 1; }
      .inset { fill: #ffffff; stroke: #7d7d7d; stroke-width: 1; }
      .button { fill: #d7d7d7; stroke: #7d7d7d; stroke-width: 1; }
      .status { fill: #d6d6d6; stroke: #8a8a8a; stroke-width: 1; }
      .menu { fill: #e6e6e6; stroke: #9a9a9a; stroke-width: 1; }
      .accent { fill: #000080; }
    </style>
  </defs>
  <rect x="30" y="24" width="460" height="250" class="window" />
  <rect x="30" y="24" width="460" height="28" class="titlebar" />
  <text x="44" y="44" class="title">Element Container</text>

  <!-- Generic element with border -->
  <rect x="50" y="70" width="180" height="120" class="panel" />
  <text x="100" y="135" class="muted">Generic Container</text>
  
  <!-- Element with children -->
  <rect x="260" y="70" width="200" height="120" class="panel" />
  <rect x="270" y="85" width="80" height="30" class="button" />
  <text x="290" y="105" class="text">Child 1</text>
  <rect x="270" y="125" width="80" height="30" class="button" />
  <text x="290" y="145" class="text">Child 2</text>
  <text x="370" y="175" class="muted">With children</text>
  
  <!-- Custom styled element -->
  <rect x="50" y="205" width="180" height="60" fill="#f0f8ff" stroke="#4169e1" stroke-width="2" />
  <text x="95" y="240" style="font: 14px 'Segoe UI'; fill: #4169e1;">Custom Styled</text>
  
  <!-- Properties -->
  <text x="260" y="285" style="font: 12px 'Courier New'; fill: #1b1b1b;">className, style, children, visible</text>

</svg>
