<svg xmlns="http://www.w3.org/2000/svg" width="520" height="300" viewBox="0 0 520 300">
  <defs>

    <style>
      .title { font: 600 16px 'Segoe UI', Arial, sans-serif; fill: #ffffff; }
      .text { font: 14px 'Segoe UI', Arial, sans-serif; fill: #1b1b1b; }
      .muted { font: 12px 'Segoe UI', Arial, sans-serif; fill: #5a5a5a; }
      .window { fill: #c0c0c0; stroke: #000; stroke-width: 2; }
      .titlebar { fill: #000080; }
      .panel { fill: #ededed; stroke: #9a9a9a; stroke-width: 1; }
      .inset { fill: #ffffff; stroke: #7d7d7d; stroke-width: 1; }
      .button { fill: #d7d7d7; stroke: #7d7d7d; stroke-width: 1; }
      .status { fill: #d6d6d6; stroke: #8a8a8a; stroke-width: 1; }
      .menu { fill: #e6e6e6; stroke: #9a9a9a; stroke-width: 1; }
      .accent { fill: #000080; }
    </style>
  </defs>
  <rect x="30" y="24" width="460" height="250" class="window" />
  <rect x="30" y="24" width="460" height="28" class="titlebar" />
  <text x="44" y="44" class="title">FlowLayoutPanel - Auto-wrapping</text>

  <!-- Horizontal flow with wrap -->
  <rect x="50" y="70" width="400" height="100" class="panel" />
  <rect x="60" y="80" width="80" height="28" class="button" />
  <text x="88" y="99" class="text">Item 1</text>
  <rect x="150" y="80" width="80" height="28" class="button" />
  <text x="178" y="99" class="text">Item 2</text>
  <rect x="240" y="80" width="80" height="28" class="button" />
  <text x="268" y="99" class="text">Item 3</text>
  <rect x="330" y="80" width="80" height="28" class="button" />
  <text x="358" y="99" class="text">Item 4</text>
  <rect x="60" y="118" width="80" height="28" class="button" />
  <text x="88" y="137" class="text">Item 5</text>
  <rect x="150" y="118" width="80" height="28" class="button" />
  <text x="178" y="137" class="text">Item 6</text>
  
  <!-- Vertical flow -->
  <rect x="50" y="185" width="180" height="90" class="panel" />
  <rect x="60" y="195" width="70" height="24" class="button" />
  <text x="84" y="212" class="text">Item 1</text>
  <rect x="60" y="227" width="70" height="24" class="button" />
  <text x="84" y="244" class="text">Item 2</text>
  <rect x="140" y="195" width="70" height="24" class="button" />
  <text x="164" y="212" class="text">Item 3</text>
  <text x="245" y="230" class="muted">Vertical flow</text>
  
  <!-- Properties -->
  <text x="260" y="285" style="font: 12px 'Courier New'; fill: #1b1b1b;">direction, wrap, spacing, alignment</text>

</svg>
