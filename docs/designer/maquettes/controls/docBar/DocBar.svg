<svg xmlns="http://www.w3.org/2000/svg" width="520" height="300" viewBox="0 0 520 300">
  <defs>

    <style>
      .title { font: 600 16px 'Segoe UI', Arial, sans-serif; fill: #ffffff; }
      .text { font: 14px 'Segoe UI', Arial, sans-serif; fill: #1b1b1b; }
      .muted { font: 12px 'Segoe UI', Arial, sans-serif; fill: #5a5a5a; }
      .window { fill: #c0c0c0; stroke: #000; stroke-width: 2; }
      .titlebar { fill: #000080; }
      .panel { fill: #ededed; stroke: #9a9a9a; stroke-width: 1; }
      .inset { fill: #ffffff; stroke: #7d7d7d; stroke-width: 1; }
      .button { fill: #d7d7d7; stroke: #7d7d7d; stroke-width: 1; }
      .status { fill: #d6d6d6; stroke: #8a8a8a; stroke-width: 1; }
      .menu { fill: #e6e6e6; stroke: #9a9a9a; stroke-width: 1; }
      .accent { fill: #000080; }
    </style>
  </defs>
  <rect x="30" y="24" width="460" height="250" class="window" />
  <rect x="30" y="24" width="460" height="28" class="titlebar" />
  <text x="44" y="44" class="title">DocBar - Document Tabs</text>

  <!-- Document tab bar -->
  <rect x="50" y="70" width="400" height="32" class="panel" />
  
  <!-- Active tab -->
  <rect x="55" y="74" width="120" height="24" class="inset" />
  <text x="75" y="92" class="text">MainWindow.scw</text>
  <rect x="165" y="78" width="12" height="12" class="button" />
  <text x="167" y="88" style="font: 10px 'Segoe UI'; fill: #1b1b1b;">X</text>
  
  <!-- Inactive tabs -->
  <rect x="180" y="76" width="100" height="22" class="button" />
  <text x="195" y="93" class="text">Panel.scw</text>
  <rect x="270" y="80" width="10" height="10" class="button" />
  <text x="271" y="89" style="font: 8px 'Segoe UI'; fill: #1b1b1b;">X</text>
  
  <rect x="285" y="76" width="110" height="22" class="button" />
  <text x="300" y="93" class="text">Controls.scw</text>
  <rect x="385" y="80" width="10" height="10" class="button" />
  <text x="386" y="89" style="font: 8px 'Segoe UI'; fill: #1b1b1b;">X</text>
  
  <!-- Modified indicator -->
  <rect x="400" y="76" width="35" height="22" class="button" />
  <text x="406" y="93" class="text">*</text>
  <text x="412" y="93" class="text">App</text>
  
  <!-- Content area -->
  <rect x="50" y="102" width="400" height="158" class="inset" />
  <text x="60" y="125" class="text">Document content for MainWindow.scw</text>
  <rect x="60" y="140" width="100" height="28" class="button" />
  <text x="95" y="159" class="text">Button</text>
  
  <!-- Properties -->
  <text x="50" y="280" style="font: 12px 'Courier New'; fill: #1b1b1b;">tabs: document[], activeIndex, onTabClose, onTabSwitch</text>

</svg>
