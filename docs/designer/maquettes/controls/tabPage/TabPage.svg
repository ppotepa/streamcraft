<svg xmlns="http://www.w3.org/2000/svg" width="520" height="300" viewBox="0 0 520 300">
  <defs>

    <style>
      .title { font: 600 16px 'Segoe UI', Arial, sans-serif; fill: #ffffff; }
      .text { font: 14px 'Segoe UI', Arial, sans-serif; fill: #1b1b1b; }
      .muted { font: 12px 'Segoe UI', Arial, sans-serif; fill: #5a5a5a; }
      .window { fill: #c0c0c0; stroke: #000; stroke-width: 2; }
      .titlebar { fill: #000080; }
      .panel { fill: #ededed; stroke: #9a9a9a; stroke-width: 1; }
      .inset { fill: #ffffff; stroke: #7d7d7d; stroke-width: 1; }
      .button { fill: #d7d7d7; stroke: #7d7d7d; stroke-width: 1; }
      .status { fill: #d6d6d6; stroke: #8a8a8a; stroke-width: 1; }
      .menu { fill: #e6e6e6; stroke: #9a9a9a; stroke-width: 1; }
      .accent { fill: #000080; }
    </style>
  </defs>
  <rect x="30" y="24" width="460" height="250" class="window" />
  <rect x="30" y="24" width="460" height="28" class="titlebar" />
  <text x="44" y="44" class="title">TabPage - Tab Content Area</text>

  <!-- Tab page with content -->
  <rect x="50" y="90" width="380" height="180" class="panel" />
  <rect x="50" y="70" width="80" height="24" class="accent" />
  <text x="70" y="88" class="title">Page Title</text>
  
  <!-- Content area -->
  <rect x="60" y="105" width="360" height="155" class="inset" />
  <text x="70" y="125" class="text">Tab page content:</text>
  <rect x="70" y="140" width="150" height="28" class="button" />
  <text x="120" y="159" class="text">Button</text>
  <text x="70" y="185" class="muted">Label text</text>
  <rect x="70" y="195" width="200" height="28" class="inset" />
  <text x="75" y="214" class="text">Input field</text>
  <rect x="70" y="235" width="80" height="24" class="button" />
  <text x="96" y="252" class="text">Submit</text>
  
  <!-- Properties -->
  <text x="50" y="290" class="muted">Properties:</text>
  <text x="50" y="310" style="font: 12px 'Courier New'; fill: #1b1b1b;">title, visible, children</text>

</svg>
