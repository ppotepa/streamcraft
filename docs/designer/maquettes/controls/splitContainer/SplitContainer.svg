<svg xmlns="http://www.w3.org/2000/svg" width="520" height="300" viewBox="0 0 520 300">
  <defs>

    <style>
      .title { font: 600 16px 'Segoe UI', Arial, sans-serif; fill: #ffffff; }
      .text { font: 14px 'Segoe UI', Arial, sans-serif; fill: #1b1b1b; }
      .muted { font: 12px 'Segoe UI', Arial, sans-serif; fill: #5a5a5a; }
      .window { fill: #c0c0c0; stroke: #000; stroke-width: 2; }
      .titlebar { fill: #000080; }
      .panel { fill: #ededed; stroke: #9a9a9a; stroke-width: 1; }
      .inset { fill: #ffffff; stroke: #7d7d7d; stroke-width: 1; }
      .button { fill: #d7d7d7; stroke: #7d7d7d; stroke-width: 1; }
      .status { fill: #d6d6d6; stroke: #8a8a8a; stroke-width: 1; }
      .menu { fill: #e6e6e6; stroke: #9a9a9a; stroke-width: 1; }
      .accent { fill: #000080; }
    </style>
  </defs>
  <rect x="30" y="24" width="460" height="250" class="window" />
  <rect x="30" y="24" width="460" height="28" class="titlebar" />
  <text x="44" y="44" class="title">SplitContainer - Resizable Splitter</text>

  <!-- Horizontal split -->
  <rect x="50" y="70" width="200" height="100" class="panel" />
  <rect x="50" y="70" width="90" height="100" class="inset" />
  <text x="78" y="125" class="text">Panel 1</text>
  <rect x="144" y="70" width="6" height="100" class="button" />
  <rect x="150" y="70" width="100" height="100" class="inset" />
  <text x="182" y="125" class="text">Panel 2</text>
  <text x="260" y="120" class="muted">Horizontal</text>
  
  <!-- Vertical split -->
  <rect x="50" y="190" width="200" height="80" class="panel" />
  <rect x="50" y="190" width="200" height="35" class="inset" />
  <text x="130" y="212" class="text">Panel 1</text>
  <rect x="50" y="225" width="200" height="6" class="button" />
  <rect x="50" y="231" width="200" height="39" class="inset" />
  <text x="130" y="255" class="text">Panel 2</text>
  <text x="260" y="235" class="muted">Vertical</text>
  
  <!-- Properties -->
  <text x="290" y="285" style="font: 12px 'Courier New'; fill: #1b1b1b;">orientation, splitterPosition</text>
  <text x="290" y="303" style="font: 12px 'Courier New'; fill: #1b1b1b;">panel1MinSize, panel2MinSize</text>

</svg>
