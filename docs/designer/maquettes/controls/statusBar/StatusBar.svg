<svg xmlns="http://www.w3.org/2000/svg" width="520" height="300" viewBox="0 0 520 300">
  <defs>

    <style>
      .title { font: 600 16px 'Segoe UI', Arial, sans-serif; fill: #ffffff; }
      .text { font: 14px 'Segoe UI', Arial, sans-serif; fill: #1b1b1b; }
      .muted { font: 12px 'Segoe UI', Arial, sans-serif; fill: #5a5a5a; }
      .window { fill: #c0c0c0; stroke: #000; stroke-width: 2; }
      .titlebar { fill: #000080; }
      .panel { fill: #ededed; stroke: #9a9a9a; stroke-width: 1; }
      .inset { fill: #ffffff; stroke: #7d7d7d; stroke-width: 1; }
      .button { fill: #d7d7d7; stroke: #7d7d7d; stroke-width: 1; }
      .status { fill: #d6d6d6; stroke: #8a8a8a; stroke-width: 1; }
      .menu { fill: #e6e6e6; stroke: #9a9a9a; stroke-width: 1; }
      .accent { fill: #000080; }
    </style>
  </defs>
  <rect x="30" y="24" width="460" height="250" class="window" />
  <rect x="30" y="24" width="460" height="28" class="titlebar" />
  <text x="44" y="44" class="title">StatusBar - Bottom Status</text>

  <!-- Status bar with segments -->
  <rect x="50" y="230" width="400" height="28" class="status" />
  
  <!-- Text segment -->
  <text x="60" y="250" class="text">Ready</text>
  
  <!-- Separator -->
  <line x1="120" y1="235" x2="120" y2="253" stroke="#9a9a9a" stroke-width="1" />
  
  <!-- Progress indicator -->
  <rect x="130" y="237" width="80" height="16" fill="#fff" stroke="#7d7d7d" stroke-width="1" />
  <rect x="132" y="239" width="50" height="12" class="accent" />
  <text x="220" y="250" class="muted">63%</text>
  
  <!-- Separator -->
  <line x1="270" y1="235" x2="270" y2="253" stroke="#9a9a9a" stroke-width="1" />
  
  <!-- Info segment -->
  <text x="280" y="250" class="text">Line: 42, Col: 15</text>
  
  <!-- Right-aligned segment -->
  <text x="400" y="250" class="text">UTF-8</text>
  
  <!-- Multiple segments example -->
  <rect x="50" y="135" width="400" height="28" class="status" />
  <text x="60" y="155" style="fill: #28a745; font: 14px 'Segoe UI';">Connected</text>
  <line x1="140" y1="140" x2="140" y2="158" stroke="#9a9a9a" stroke-width="1" />
  <text x="150" y="155" class="text">3 items</text>
  <line x1="220" y1="140" x2="220" y2="158" stroke="#9a9a9a" stroke-width="1" />
  <text x="230" y="155" class="muted">Modified</text>
  <text x="400" y="155" class="text">12:34 PM</text>
  
  <!-- Properties -->
  <text x="50" y="280" style="font: 12px 'Courier New'; fill: #1b1b1b;">segments: StatusSegment[], text, alignment</text>

</svg>
