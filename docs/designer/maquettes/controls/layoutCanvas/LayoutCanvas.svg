<svg xmlns="http://www.w3.org/2000/svg" width="520" height="300" viewBox="0 0 520 300">
  <defs>

    <style>
      .title { font: 600 16px 'Segoe UI', Arial, sans-serif; fill: #ffffff; }
      .text { font: 14px 'Segoe UI', Arial, sans-serif; fill: #1b1b1b; }
      .muted { font: 12px 'Segoe UI', Arial, sans-serif; fill: #5a5a5a; }
      .window { fill: #c0c0c0; stroke: #000; stroke-width: 2; }
      .titlebar { fill: #000080; }
      .panel { fill: #ededed; stroke: #9a9a9a; stroke-width: 1; }
      .inset { fill: #ffffff; stroke: #7d7d7d; stroke-width: 1; }
      .button { fill: #d7d7d7; stroke: #7d7d7d; stroke-width: 1; }
      .status { fill: #d6d6d6; stroke: #8a8a8a; stroke-width: 1; }
      .menu { fill: #e6e6e6; stroke: #9a9a9a; stroke-width: 1; }
      .accent { fill: #000080; }
    </style>
  </defs>
  <rect x="30" y="24" width="460" height="250" class="window" />
  <rect x="30" y="24" width="460" height="28" class="titlebar" />
  <text x="44" y="44" class="title">LayoutCanvas - Absolute Positioning</text>

  <!-- Canvas with grid -->
  <rect x="50" y="70" width="400" height="200" fill="#f5f5f5" stroke="#7d7d7d" stroke-width="1" />
  
  <!-- Grid lines -->
  <line x1="90" y1="70" x2="90" y2="270" stroke="#ddd" stroke-width="1" />
  <line x1="130" y1="70" x2="130" y2="270" stroke="#ddd" stroke-width="1" />
  <line x1="170" y1="70" x2="170" y2="270" stroke="#ddd" stroke-width="1" />
  <line x1="210" y1="70" x2="210" y2="270" stroke="#ddd" stroke-width="1" />
  <line x1="250" y1="70" x2="250" y2="270" stroke="#ddd" stroke-width="1" />
  <line x1="290" y1="70" x2="290" y2="270" stroke="#ddd" stroke-width="1" />
  <line x1="330" y1="70" x2="330" y2="270" stroke="#ddd" stroke-width="1" />
  <line x1="370" y1="70" x2="370" y2="270" stroke="#ddd" stroke-width="1" />
  <line x1="410" y1="70" x2="410" y2="270" stroke="#ddd" stroke-width="1" />
  <line x1="50" y1="110" x2="450" y2="110" stroke="#ddd" stroke-width="1" />
  <line x1="50" y1="150" x2="450" y2="150" stroke="#ddd" stroke-width="1" />
  <line x1="50" y1="190" x2="450" y2="190" stroke="#ddd" stroke-width="1" />
  <line x1="50" y1="230" x2="450" y2="230" stroke="#ddd" stroke-width="1" />
  
  <!-- Positioned elements -->
  <rect x="70" y="90" width="100" height="40" class="button" />
  <text x="105" y="115" class="text">x:20,y:20</text>
  <rect x="250" y="140" width="120" height="60" class="panel" />
  <text x="285" y="175" class="text">x:200,y:70</text>
  
  <!-- Properties -->
  <text x="50" y="290" style="font: 12px 'Courier New'; fill: #1b1b1b;">gridSize, showGrid, allowDrag, allowResize</text>

</svg>
