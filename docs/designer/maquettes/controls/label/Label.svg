<svg xmlns="http://www.w3.org/2000/svg" width="520" height="300" viewBox="0 0 520 300">
  <defs>

    <style>
      .title { font: 600 16px 'Segoe UI', Arial, sans-serif; fill: #ffffff; }
      .text { font: 14px 'Segoe UI', Arial, sans-serif; fill: #1b1b1b; }
      .muted { font: 12px 'Segoe UI', Arial, sans-serif; fill: #5a5a5a; }
      .window { fill: #c0c0c0; stroke: #000; stroke-width: 2; }
      .titlebar { fill: #000080; }
      .panel { fill: #ededed; stroke: #9a9a9a; stroke-width: 1; }
      .inset { fill: #ffffff; stroke: #7d7d7d; stroke-width: 1; }
      .button { fill: #d7d7d7; stroke: #7d7d7d; stroke-width: 1; }
      .status { fill: #d6d6d6; stroke: #8a8a8a; stroke-width: 1; }
      .menu { fill: #e6e6e6; stroke: #9a9a9a; stroke-width: 1; }
      .accent { fill: #000080; }
    </style>
  </defs>
  <rect x="30" y="24" width="460" height="250" class="window" />
  <rect x="30" y="24" width="460" height="28" class="titlebar" />
  <text x="44" y="44" class="title">Label Control</text>

  <!-- Default -->
  <text x="50" y="80" class="text">Default label text</text>
  
  <!-- Small -->
  <text x="50" y="105" style="font: 12px 'Segoe UI'; fill: #1b1b1b;">Small label text</text>
  
  <!-- Large -->
  <text x="50" y="135" style="font: 18px 'Segoe UI'; fill: #1b1b1b;">Large label text</text>
  
  <!-- Bold -->
  <text x="50" y="165" style="font: bold 14px 'Segoe UI'; fill: #1b1b1b;">Bold label text</text>
  
  <!-- Colored -->
  <text x="50" y="190" style="font: 14px 'Segoe UI'; fill: #dc3545;">Colored label text</text>
  
  <!-- Muted -->
  <text x="50" y="215" class="muted">Muted label text</text>
  
  <!-- Properties -->
  <text x="50" y="240" class="muted">Properties:</text>
  <text x="50" y="260" style="font: 12px 'Courier New'; fill: #1b1b1b;">text, textAlign, wrap, fontSize, fontWeight, color</text>

</svg>
