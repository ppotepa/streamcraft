<svg xmlns="http://www.w3.org/2000/svg" width="520" height="300" viewBox="0 0 520 300">
  <defs>

    <style>
      .title { font: 600 16px 'Segoe UI', Arial, sans-serif; fill: #ffffff; }
      .text { font: 14px 'Segoe UI', Arial, sans-serif; fill: #1b1b1b; }
      .muted { font: 12px 'Segoe UI', Arial, sans-serif; fill: #5a5a5a; }
      .window { fill: #c0c0c0; stroke: #000; stroke-width: 2; }
      .titlebar { fill: #000080; }
      .panel { fill: #ededed; stroke: #9a9a9a; stroke-width: 1; }
      .inset { fill: #ffffff; stroke: #7d7d7d; stroke-width: 1; }
      .button { fill: #d7d7d7; stroke: #7d7d7d; stroke-width: 1; }
      .status { fill: #d6d6d6; stroke: #8a8a8a; stroke-width: 1; }
      .menu { fill: #e6e6e6; stroke: #9a9a9a; stroke-width: 1; }
      .accent { fill: #000080; }
    </style>
  </defs>
  <rect x="30" y="24" width="460" height="250" class="window" />
  <rect x="30" y="24" width="460" height="28" class="titlebar" />
  <text x="44" y="44" class="title">TableLayoutPanel - Table Structure</text>

  <!-- Table with cells -->
  <rect x="50" y="70" width="400" height="180" class="panel" />
  
  <!-- Grid lines -->
  <line x1="180" y1="70" x2="180" y2="250" stroke="#7d7d7d" stroke-width="1" />
  <line x1="320" y1="70" x2="320" y2="250" stroke="#7d7d7d" stroke-width="1" />
  <line x1="50" y1="115" x2="450" y2="115" stroke="#7d7d7d" stroke-width="1" />
  <line x1="50" y1="160" x2="450" y2="160" stroke="#7d7d7d" stroke-width="1" />
  <line x1="50" y1="205" x2="450" y2="205" stroke="#7d7d7d" stroke-width="1" />
  
  <!-- Cell labels -->
  <text x="100" y="96" class="muted">Col 1</text>
  <text x="235" y="96" class="muted">Col 2</text>
  <text x="370" y="96" class="muted">Col 3</text>
  
  <!-- Cell content -->
  <rect x="60" y="125" width="100" height="25" class="button" />
  <text x="95" y="142" class="text">R1,C1</text>
  
  <rect x="190" y="125" width="120" height="25" class="button" />
  <text x="232" y="142" class="text">R1,C2</text>
  
  <rect x="60" y="170" width="100" height="25" class="button" />
  <text x="95" y="187" class="text">R2,C1</text>
  
  <rect x="190" y="170" width="250" height="70" class="panel" />
  <text x="290" y="210" class="text">Colspan=2, Rowspan=2</text>
  
  <rect x="60" y="215" width="100" height="25" class="button" />
  <text x="95" y="232" class="text">R3,C1</text>
  
  <!-- Properties -->
  <text x="50" y="275" style="font: 12px 'Courier New'; fill: #1b1b1b;">rows, columns, columnStyles, rowStyles, cellSpacing</text>

</svg>
