<svg xmlns="http://www.w3.org/2000/svg" width="520" height="300" viewBox="0 0 520 300">
  <defs>

    <style>
      .title { font: 600 16px 'Segoe UI', Arial, sans-serif; fill: #ffffff; }
      .text { font: 14px 'Segoe UI', Arial, sans-serif; fill: #1b1b1b; }
      .muted { font: 12px 'Segoe UI', Arial, sans-serif; fill: #5a5a5a; }
      .window { fill: #c0c0c0; stroke: #000; stroke-width: 2; }
      .titlebar { fill: #000080; }
      .panel { fill: #ededed; stroke: #9a9a9a; stroke-width: 1; }
      .inset { fill: #ffffff; stroke: #7d7d7d; stroke-width: 1; }
      .button { fill: #d7d7d7; stroke: #7d7d7d; stroke-width: 1; }
      .status { fill: #d6d6d6; stroke: #8a8a8a; stroke-width: 1; }
      .menu { fill: #e6e6e6; stroke: #9a9a9a; stroke-width: 1; }
      .accent { fill: #000080; }
    </style>
  </defs>
  <rect x="30" y="24" width="460" height="250" class="window" />
  <rect x="30" y="24" width="460" height="28" class="titlebar" />
  <text x="44" y="44" class="title">TextBox Control</text>

  <!-- Single-line -->
  <rect x="50" y="65" width="200" height="28" class="inset" />
  <text x="55" y="84" class="text">Sample text</text>
  <text x="260" y="82" class="muted">Single-line</text>
  
  <!-- With placeholder -->
  <rect x="50" y="105" width="200" height="28" class="inset" />
  <text x="55" y="124" style="font: 14px 'Segoe UI'; fill: #999;">Enter your name...</text>
  <text x="260" y="122" class="muted">Placeholder</text>
  
  <!-- Password -->
  <rect x="50" y="145" width="200" height="28" class="inset" />
  <text x="55" y="164" class="text">••••••••</text>
  <text x="260" y="162" class="muted">Password</text>
  
  <!-- Disabled -->
  <rect x="50" y="185" width="200" height="28" fill="#e9ecef" stroke="#ced4da" stroke-width="1" />
  <text x="55" y="204" style="fill: #6c757d; font: 14px 'Segoe UI';">Disabled text</text>
  <text x="260" y="202" class="muted">Disabled</text>
  
  <!-- Multi-line -->
  <rect x="50" y="225" width="300" height="60" class="inset" />
  <text x="55" y="244" class="text">This is a multi-line</text>
  <text x="55" y="262" class="text">text box that allows</text>
  <text x="55" y="280" class="text">multiple rows of text.</text>
  <text x="360" y="257" class="muted">Multi-line</text>

</svg>
