<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" fill="none">
  <defs>
    <style>
      .bg { fill: #e9ecf2; }
      .window { fill: #f5f5f7; stroke: #d0d5dd; stroke-width: 1; rx: 0; }
      .appbar { fill: #ffffff; stroke: #d0d5dd; stroke-width: 1; rx: 0; }
      .toolbar { fill: #ffffff; stroke: #d0d5dd; stroke-width: 1; rx: 0; }
      .panel { fill: #ffffff; stroke: #d0d5dd; stroke-width: 1; rx: 0; }
      .canvas { fill: #ffffff; stroke: #d0d5dd; stroke-width: 1; rx: 0; }
      .chip { fill: #eef2ff; rx: 0; }
      .btn { fill: #3b82f6; rx: 0; }
      .btn-ghost { fill: #ffffff; stroke: #d0d5dd; stroke-width: 1; rx: 0; }
      .muted { fill: #6b7280; font: 12px "Inter", "Segoe UI", sans-serif; }
      .text { fill: #111827; font: 13px "Inter", "Segoe UI", sans-serif; }
      .title { fill: #0f172a; font: 600 16px "Inter", "Segoe UI", sans-serif; }
      .small { fill: #6b7280; font: 11px "Inter", "Segoe UI", sans-serif; }
      .status { fill: #ffffff; stroke: #d0d5dd; stroke-width: 1; rx: 0; }
      .shadow { filter: drop-shadow(0 12px 20px rgba(15, 23, 42, 0.12)); }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="760" />

  <rect class="window shadow" x="30" y="24" width="1140" height="712" rx="0" />

  <!-- App bar -->
  <rect class="appbar" x="50" y="38" width="1100" height="52" rx="0" />
  <text class="title" x="70" y="70">StreamCraft Designer • Material Edge</text>
  <rect class="btn" x="980" y="50" width="140" height="28" rx="0" />
  <text class="text" x="1018" y="69" fill="#ffffff">Publish</text>

  <!-- Menu row -->
  <text class="text" x="70" y="112">File</text>
  <text class="text" x="112" y="112">Edit</text>
  <text class="text" x="156" y="112">View</text>
  <text class="text" x="206" y="112">Tools</text>

  <!-- Context toolbar -->
  <rect class="toolbar" x="50" y="122" width="1100" height="52" rx="0" />
  <rect class="btn-ghost" x="70" y="134" width="36" height="28" rx="0" />
  <rect class="btn-ghost" x="112" y="134" width="36" height="28" rx="0" />
  <rect class="btn-ghost" x="154" y="134" width="36" height="28" rx="0" />
  <rect class="btn-ghost" x="206" y="134" width="160" height="28" rx="0" />
  <text class="small" x="220" y="152">Font: Inter</text>
  <rect class="btn-ghost" x="374" y="134" width="60" height="28" rx="0" />
  <text class="small" x="392" y="152">16</text>
  <rect class="btn-ghost" x="450" y="134" width="88" height="28" rx="0" />
  <text class="small" x="468" y="152">#111827</text>

  <!-- Left toolbox -->
  <rect class="panel" x="50" y="186" width="200" height="470" rx="0" />
  <text class="title" x="70" y="214">Toolbox</text>
  <rect class="chip" x="70" y="228" width="64" height="22" rx="0" />
  <text class="small" x="86" y="243">Basic</text>
  <rect class="btn-ghost" x="70" y="262" width="160" height="30" rx="0" />
  <text class="text" x="88" y="282">Text</text>
  <rect class="btn-ghost" x="70" y="300" width="160" height="30" rx="0" />
  <text class="text" x="88" y="320">Image</text>
  <rect class="btn-ghost" x="70" y="338" width="160" height="30" rx="0" />
  <text class="text" x="88" y="358">Rectangle</text>
  <rect class="btn-ghost" x="70" y="376" width="160" height="30" rx="0" />
  <text class="text" x="88" y="396">Progress</text>
  <text class="small" x="70" y="430">Containers</text>
  <rect class="btn-ghost" x="70" y="444" width="160" height="30" rx="0" />
  <text class="text" x="88" y="464">Panel</text>

  <!-- Canvas -->
  <rect class="canvas" x="270" y="186" width="620" height="470" rx="0" />
  <rect x="302" y="224" width="140" height="36" fill="#e2e8f0" rx="0" />
  <text class="text" x="330" y="247">Title</text>
  <rect x="302" y="276" width="240" height="32" fill="#f1f5f9" rx="0" />
  <text class="small" x="314" y="296">Subtitle text</text>
  <rect x="302" y="330" width="180" height="44" fill="#3b82f6" rx="0" />
  <text class="text" x="354" y="358" fill="#ffffff">CTA</text>
  <rect x="520" y="300" width="260" height="160" fill="#f8fafc" rx="0" stroke="#d0d5dd" stroke-width="1" />
  <text class="small" x="536" y="326">Image placeholder</text>

  <!-- Properties panel -->
  <rect class="panel" x="910" y="186" width="240" height="470" rx="0" />
  <text class="title" x="930" y="214">Properties</text>
  <rect class="chip" x="930" y="228" width="54" height="22" rx="0" />
  <text class="small" x="942" y="243">Layout</text>
  <rect class="btn-ghost" x="930" y="264" width="200" height="28" rx="0" />
  <text class="small" x="942" y="282">Name</text>
  <rect class="btn-ghost" x="930" y="300" width="200" height="28" rx="0" />
  <text class="small" x="942" y="318">Text</text>
  <rect class="btn-ghost" x="930" y="336" width="96" height="28" rx="0" />
  <rect class="btn-ghost" x="1034" y="336" width="96" height="28" rx="0" />
  <text class="small" x="942" y="356">Width</text>
  <text class="small" x="1046" y="356">Height</text>
  <rect class="btn-ghost" x="930" y="380" width="200" height="28" rx="0" />
  <text class="small" x="942" y="398">Fill</text>

  <!-- Status bar -->
  <rect class="status" x="50" y="668" width="1100" height="46" rx="0" />
  <text class="text" x="70" y="696">Ready</text>
  <text class="small" x="170" y="696">Zoom 100%</text>
  <text class="small" x="260" y="696">Autosave on</text>
</svg>
