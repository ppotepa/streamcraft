<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="480" viewBox="0 0 1160 480">
  <defs>
    <style>
      .title { font: 600 16px 'Segoe UI', Arial, sans-serif; fill: #ffffff; }
      .text { font: 14px 'Segoe UI', Arial, sans-serif; fill: #1b1b1b; }
      .small { font: 12px 'Segoe UI', Arial, sans-serif; fill: #1b1b1b; }
      .small-muted { font: 12px 'Segoe UI', Arial, sans-serif; fill: #5a5a5a; }
      .small-disabled { font: 12px 'Segoe UI', Arial, sans-serif; fill: #a0a0a0; }
      .window { fill: #c0c0c0; stroke: #000; stroke-width: 2; }
      .titlebar { fill: #000080; }
      .panel { fill: #ededed; stroke: #9a9a9a; stroke-width: 1; }
      .header { fill: #d6d6d6; stroke: #9a9a9a; stroke-width: 1; }
      .row { fill: #f8f8f8; stroke: #e0e0e0; stroke-width: 1; }
      .row-disabled { fill: #e8e8e8; stroke: #e0e0e0; stroke-width: 1; }
      .row-selected { fill: #000080; }
      .button { fill: #d7d7d7; stroke: #7d7d7d; stroke-width: 1; }
      .status-running { fill: #28a745; }
      .status-stopped { fill: #9a9a9a; }
      .activity-executing { fill: #90ee90; }
      .activity-idle { fill: #1e7e34; }
      .activity-error { fill: #dc3545; }
      .activity-queued { fill: #ffa500; }
    </style>
  </defs>
  <rect x="20" y="20" width="1120" height="440" class="window" />
  <rect x="20" y="20" width="1120" height="28" class="titlebar" />
  <text x="34" y="40" class="title">Scheduler</text>
  <rect x="30" y="58" width="1100" height="372" class="panel" />
  <text x="40" y="78" class="small-muted">Active Workers: 3 running, 1 stopped</text>
  <line x1="40" y1="86" x2="1120" y2="86" stroke="#e0e0e0" stroke-width="1" />
  <rect x="40" y="94" width="1080" height="26" class="header" />
  <text x="50" y="112" style="font: 12px 'Segoe UI'; font-weight: 600;">Name</text>
  <text x="220" y="112" style="font: 12px 'Segoe UI'; font-weight: 600;">Enabled</text>
  <text x="300" y="112" style="font: 12px 'Segoe UI'; font-weight: 600;">Active</text>
  <text x="370" y="112" style="font: 12px 'Segoe UI'; font-weight: 600;">Status</text>
  <text x="450" y="112" style="font: 12px 'Segoe UI'; font-weight: 600;">Data Source</text>
  <text x="640" y="112" style="font: 12px 'Segoe UI'; font-weight: 600; text-anchor: end;">Interval</text>
  <text x="740" y="112" style="font: 12px 'Segoe UI'; font-weight: 600;">Last Run</text>
  <text x="880" y="112" style="font: 12px 'Segoe UI'; font-weight: 600; text-anchor: end;">Executions</text>
  <text x="1010" y="112" style="font: 12px 'Segoe UI'; font-weight: 600; text-anchor: end;">Success Rate</text>
  <text x="1080" y="112" style="font: 12px 'Segoe UI'; font-weight: 600;">Logs</text>
  <rect x="40" y="120" width="1080" height="32" class="row-selected" />
  <text x="50" y="140" style="font: 12px 'Segoe UI'; fill: #fff;">lblStatus Worker</text>
  <circle cx="230" cy="136" r="5" class="status-running" />
  <circle cx="310" cy="136" r="5" class="activity-executing" />
  <text x="380" y="140" style="font: 12px 'Segoe UI'; fill: #fff;">Running</text>
  <text x="460" y="140" style="font: 12px 'Segoe UI'; fill: #fff;">SC2 Pulse API</text>
  <text x="640" y="140" style="font: 12px 'Segoe UI'; fill: #fff; text-anchor: end;">1000ms</text>
  <text x="750" y="140" style="font: 12px 'Segoe UI'; fill: #fff;">2s ago</text>
  <text x="880" y="140" style="font: 12px 'Segoe UI'; fill: #fff; font-weight: 600; text-anchor: end;">1247</text>
  <text x="1010" y="140" style="font: 12px 'Segoe UI'; fill: #fff; font-weight: 600; text-anchor: end;">98.5%</text>
  <text x="1085" y="140" style="font: 11px 'Segoe UI'; fill: #4fc1ff; text-decoration: underline;">View</text>
  <rect x="40" y="152" width="1080" height="32" class="row" />
  <text x="50" y="172" class="small">imgAvatar Worker</text>
  <circle cx="230" cy="168" r="5" class="status-running" />
  <circle cx="310" cy="168" r="5" class="activity-idle" />
  <text x="380" y="172" class="small">Idle</text>
  <text x="460" y="172" class="small">Player Images API</text>
  <text x="640" y="172" class="small" style="text-anchor: end;">5000ms</text>
  <text x="750" y="172" class="small">5s ago</text>
  <text x="880" y="172" class="small" style="font-weight: 600; text-anchor: end;">324</text>
  <text x="1010" y="172" class="small" style="font-weight: 600; text-anchor: end;">100.0%</text>
  <text x="1085" y="172" style="font: 11px 'Segoe UI'; fill: #4fc1ff; text-decoration: underline;">View</text>
  <line x1="40" y1="400" x2="1120" y2="400" stroke="#e0e0e0" stroke-width="1" />
  <text x="40" y="420" style="font: 11px 'Segoe UI'; fill: #5a5a5a;">Selected: lblStatus Worker → response.player.name</text>
  <rect x="760" y="408" width="70" height="18" class="button" />
  <text x="780" y="420" style="font: 11px 'Segoe UI';">Start</text>
  <rect x="840" y="408" width="70" height="18" class="button" />
  <text x="862" y="420" style="font: 11px 'Segoe UI';">Stop</text>
  <rect x="920" y="408" width="80" height="18" class="button" />
  <text x="936" y="420" style="font: 11px 'Segoe UI';">Details...</text>
  <rect x="1010" y="408" width="60" height="18" class="button" />
  <text x="1028" y="420" style="font: 11px 'Segoe UI';">Close</text>
</svg>
