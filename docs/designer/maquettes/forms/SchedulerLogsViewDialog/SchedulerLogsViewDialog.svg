<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <defs>
    <style>
      .bg { fill: #c0c0c0; }
      .dialog { fill: #ededed; stroke: #9a9a9a; stroke-width: 1; }
      .header { fill: #d6d6d6; }
      .text { fill: #1b1b1b; font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; }
      .text-bold { fill: #1b1b1b; font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; font-weight: 600; }
      .title { fill: #ffffff; font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; font-weight: 600; }
      .button { fill: #d7d7d7; stroke: #7d7d7d; stroke-width: 1; }
      .button-text { fill: #1b1b1b; font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; }
      .row-odd { fill: #f8f8f8; }
      .row-even { fill: #ffffff; }
      .row-selected { fill: #000080; }
      .row-selected-text { fill: #ffffff; }
      .status-success { fill: #4ec9b0; font-weight: 600; }
      .status-failed { fill: #f48771; font-weight: 600; }
      .status-running { fill: #4fc1ff; font-weight: 600; }
      .divider { stroke: #e0e0e0; stroke-width: 1; }
      .panel { fill: #ffffff; stroke: #9a9a9a; stroke-width: 1; }
      .code-text { fill: #1b1b1b; font-family: 'Consolas', monospace; font-size: 11px; }
      .label-key { fill: #1b1b1b; font-family: 'Consolas', monospace; font-size: 11px; }
      .label-section { fill: #1b1b1b; font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: 600; }
