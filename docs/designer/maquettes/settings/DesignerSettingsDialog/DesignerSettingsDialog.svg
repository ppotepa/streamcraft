<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="3600" viewBox="0 0 1400 3600" fill="none">
  <defs>
    <style>
      .frame { fill: #c0c0c0; stroke: #808080; stroke-width: 2; }
      .titlebar { fill: #000080; }
      .tabbar { fill: #c0c0c0; }
      .tab { fill: #c0c0c0; stroke: #808080; stroke-width: 1; }
      .tab-active { fill: #ffffff; stroke: #808080; stroke-width: 1; }
      .panel { fill: #c0c0c0; stroke: #808080; stroke-width: 1; }
      .groupbox { fill: #c0c0c0; stroke: #808080; stroke-width: 1; }
      .groupbox-title { font-family: "MS Sans Serif", Arial, sans-serif; font-size: 12px; fill: #000000; }
      .label { font-family: \"MS Sans Serif\", Arial, sans-serif; font-size: 14px; fill: #000000; }
      .label-muted { font-family: \"MS Sans Serif\", Arial, sans-serif; font-size: 12px; fill: #404040; }
      .label-title { font-family: \"MS Sans Serif\", Arial, sans-serif; font-size: 16px; font-weight: 600; fill: #000000; }
      .button { fill: #c0c0c0; stroke: #404040; stroke-width: 1; }
      .button-primary { fill: #c0c0c0; stroke: #404040; stroke-width: 1; }
      .field { fill: #ffffff; stroke: #404040; stroke-width: 1; }
      .checkbox { fill: #ffffff; stroke: #404040; stroke-width: 1; }
      .checkmark { stroke: #000000; stroke-width: 2; }
      .section-label { font-family: \"MS Sans Serif\", Arial, sans-serif; font-size: 18px; font-weight: 600; fill: #111; }
      .section-bg { fill: #a0a0a0; }
    </style>
  </defs>

  <!-- Section headers background -->
  <rect class="section-bg" x="0" y="0" width="1400" height="3600" />

  <!-- Frame 1: General -->
  <g transform="translate(60,60)">
