<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <style>
      .title { font: 600 16px 'Segoe UI', Arial, sans-serif; fill: #ffffff; }
      .text { font: 14px 'Segoe UI', Arial, sans-serif; fill: #1b1b1b; }
      .muted { font: 12px 'Segoe UI', Arial, sans-serif; fill: #5a5a5a; }
      .window { fill: #c0c0c0; stroke: #000; stroke-width: 2; }
      .titlebar { fill: #000080; }
      .panel { fill: #ededed; stroke: #9a9a9a; stroke-width: 1; }
      .inset { fill: #ffffff; stroke: #7d7d7d; stroke-width: 1; }
      .button { fill: #d7d7d7; stroke: #7d7d7d; stroke-width: 1; }
      .status { fill: #d6d6d6; stroke: #8a8a8a; stroke-width: 1; }
      .menu { fill: #e6e6e6; stroke: #9a9a9a; stroke-width: 1; }
      .accent { fill: #000080; }
    </style>
  </defs>
  
  <!-- Main window -->
  <rect x="20" y="20" width="760" height="560" class="window" />
  <rect x="20" y="20" width="760" height="28" class="titlebar" />
  <text x="30" y="40" class="title">Playground2 - Complete Designer View</text>
  
  <!-- Menu bar -->
  <rect x="20" y="48" width="760" height="28" class="menu" />
  <text x="30" y="68" class="text">File</text>
  <text x="70" y="68" class="text">Edit</text>
  <text x="115" y="68" class="text">View</text>
  <text x="165" y="68" class="text">Tools</text>
  
  <!-- Toolbar -->
  <rect x="20" y="76" width="760" height="36" class="panel" />
  <rect x="30" y="83" width="28" height="22" class="button" />
  <rect x="65" y="83" width="28" height="22" class="button" />
  <rect x="100" y="83" width="28" height="22" class="accent" />
  <line x1="140" y1="83" x2="140" y2="105" stroke="#7d7d7d" />
  <rect x="150" y="83" width="28" height="22" class="button" />
  <rect x="185" y="83" width="28" height="22" class="button" />
  
  <!-- Left panel - Toolbox -->
  <rect x="20" y="112" width="140" height="428" class="panel" />
  <rect x="20" y="112" width="140" height="22" class="menu" />
  <text x="30" y="128" class="text">Toolbox</text>
  <text x="30" y="155" style="font: bold 11px 'Segoe UI'; fill: #1b1b1b;">Controls</text>
  <rect x="30" y="162" width="120" height="20" class="button" />
  <text x="40" y="176" style="font: 12px 'Segoe UI'; fill: #1b1b1b;">Button</text>
  <rect x="30" y="185" width="120" height="20" class="button" />
  <text x="40" y="199" style="font: 12px 'Segoe UI'; fill: #1b1b1b;">TextBox</text>
  <rect x="30" y="208" width="120" height="20" class="button" />
  <text x="40" y="222" style="font: 12px 'Segoe UI'; fill: #1b1b1b;">Label</text>
  <text x="30" y="243" style="font: bold 11px 'Segoe UI'; fill: #1b1b1b;">Containers</text>
  <rect x="30" y="250" width="120" height="20" class="button" />
  <text x="40" y="264" style="font: 12px 'Segoe UI'; fill: #1b1b1b;">Panel</text>
  
  <!-- Center - Designer canvas -->
  <rect x="160" y="112" width="420" height="428" class="inset" />
  
  <!-- Canvas grid -->
  <line x1="200" y1="112" x2="200" y2="540" stroke="#e0e0e0" stroke-width="1" />
  <line x1="240" y1="112" x2="240" y2="540" stroke="#e0e0e0" stroke-width="1" />
  <line x1="280" y1="112" x2="280" y2="540" stroke="#e0e0e0" stroke-width="1" />
  <line x1="320" y1="112" x2="320" y2="540" stroke="#e0e0e0" stroke-width="1" />
  <line x1="360" y1="112" x2="360" y2="540" stroke="#e0e0e0" stroke-width="1" />
  <line x1="400" y1="112" x2="400" y2="540" stroke="#e0e0e0" stroke-width="1" />
  <line x1="440" y1="112" x2="440" y2="540" stroke="#e0e0e0" stroke-width="1" />
  <line x1="480" y1="112" x2="480" y2="540" stroke="#e0e0e0" stroke-width="1" />
  <line x1="520" y1="112" x2="520" y2="540" stroke="#e0e0e0" stroke-width="1" />
  <line x1="560" y1="112" x2="560" y2="540" stroke="#e0e0e0" stroke-width="1" />
  <line x1="160" y1="152" x2="580" y2="152" stroke="#e0e0e0" stroke-width="1" />
  <line x1="160" y1="192" x2="580" y2="192" stroke="#e0e0e0" stroke-width="1" />
  <line x1="160" y1="232" x2="580" y2="232" stroke="#e0e0e0" stroke-width="1" />
  <line x1="160" y1="272" x2="580" y2="272" stroke="#e0e0e0" stroke-width="1" />
  <line x1="160" y1="312" x2="580" y2="312" stroke="#e0e0e0" stroke-width="1" />
  <line x1="160" y1="352" x2="580" y2="352" stroke="#e0e0e0" stroke-width="1" />
  <line x1="160" y1="392" x2="580" y2="392" stroke="#e0e0e0" stroke-width="1" />
  <line x1="160" y1="432" x2="580" y2="432" stroke="#e0e0e0" stroke-width="1" />
  <line x1="160" y1="472" x2="580" y2="472" stroke="#e0e0e0" stroke-width="1" />
  
  <!-- Components on canvas -->
  <rect x="180" y="140" width="100" height="28" class="button" stroke="#000080" stroke-width="2" />
  <text x="218" y="159" class="text">Button1</text>
  
  <rect x="180" y="185" width="160" height="28" class="inset" />
  <text x="185" y="204" class="text">Enter text...</text>
  
  <text x="180" y="245" class="text">Label1</text>
  
  <rect x="320" y="280" width="220" height="140" class="panel" />
  <rect x="320" y="280" width="220" height="22" class="menu" />
  <text x="390" y="296" class="text">Panel1</text>
  
  <!-- Right panel - Properties -->
  <rect x="580" y="112" width="200" height="428" class="panel" />
  <rect x="580" y="112" width="200" height="22" class="menu" />
  <text x="590" y="128" class="text">Properties</text>
  
  <!-- Properties list -->
  <rect x="585" y="140" width="190" height="390" class="inset" />
  <text x="595" y="160" style="font: bold 11px 'Segoe UI'; fill: #1b1b1b;">Button1</text>
  <text x="595" y="180" class="muted">Name:</text>
  <rect x="595" y="188" width="175" height="20" class="inset" />
  <text x="600" y="202" style="font: 11px 'Segoe UI'; fill: #1b1b1b;">Button1</text>
  <text x="595" y="220" class="muted">Text:</text>
  <rect x="595" y="228" width="175" height="20" class="inset" />
  <text x="600" y="242" style="font: 11px 'Segoe UI'; fill: #1b1b1b;">Button1</text>
  <text x="595" y="260" class="muted">Enabled:</text>
  <rect x="595" y="266" width="14" height="14" class="inset" />
  <path d="M 598 274 L 602 278 L 607 270" fill="none" stroke="#000" stroke-width="2" />
  <text x="595" y="295" class="muted">Width:</text>
  <rect x="595" y="303" width="80" height="20" class="inset" />
  <text x="600" y="317" style="font: 11px 'Segoe UI'; fill: #1b1b1b;">100</text>
  <text x="595" y="335" class="muted">Height:</text>
  <rect x="595" y="343" width="80" height="20" class="inset" />
  <text x="600" y="357" style="font: 11px 'Segoe UI'; fill: #1b1b1b;">28</text>
  
  <!-- Document tabs -->
  <rect x="160" y="85" width="420" height="27" class="panel" />
  <rect x="165" y="88" width="100" height="21" class="inset" />
  <text x="185" y="104" class="text">Form1</text>
  <rect x="265" y="88" width="90" height="21" class="button" />
  <text x="285" y="104" class="text">Form2</text>
  
  <!-- Status bar -->
  <rect x="20" y="540" width="760" height="24" class="status" />
  <text x="30" y="557" class="text">Ready</text>
  <line x1="140" y1="542" x2="140" y2="562" stroke="#9a9a9a" />
  <text x="150" y="557" class="text">Position: 180, 140</text>
  <line x1="280" y1="542" x2="280" y2="562" stroke="#9a9a9a" />
  <text x="290" y="557" class="text">Size: 100 x 28</text>
  
  <!-- Properties label -->
  <text x="30" y="585" class="muted">Complete designer environment with toolbox, canvas, and properties</text>
  
</svg>
