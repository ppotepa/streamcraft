<svg xmlns="http://www.w3.org/2000/svg" width="520" height="300" viewBox="0 0 520 300">
  <defs>

    <style>
      .title { font: 600 16px 'Segoe UI', Arial, sans-serif; fill: #ffffff; }
      .text { font: 14px 'Segoe UI', Arial, sans-serif; fill: #1b1b1b; }
      .muted { font: 12px 'Segoe UI', Arial, sans-serif; fill: #5a5a5a; }
      .window { fill: #c0c0c0; stroke: #000; stroke-width: 2; }
      .titlebar { fill: #000080; }
      .panel { fill: #ededed; stroke: #9a9a9a; stroke-width: 1; }
      .inset { fill: #ffffff; stroke: #7d7d7d; stroke-width: 1; }
      .button { fill: #d7d7d7; stroke: #7d7d7d; stroke-width: 1; }
      .status { fill: #d6d6d6; stroke: #8a8a8a; stroke-width: 1; }
      .menu { fill: #e6e6e6; stroke: #9a9a9a; stroke-width: 1; }
      .accent { fill: #000080; }
    </style>
  </defs>
  <rect x="30" y="24" width="460" height="250" class="window" />
  <rect x="30" y="24" width="460" height="28" class="titlebar" />
  <text x="44" y="44" class="title">MessageBox Dialog</text>

  <!-- Information MessageBox -->
  <rect x="80" y="70" width="320" height="120" class="window" />
  <rect x="80" y="70" width="320" height="24" class="titlebar" />
  <text x="92" y="88" style="font: 14px 'Segoe UI'; fill: #fff;">Information</text>
  <circle cx="100" cy="125" r="12" fill="#0066cc" />
  <text x="98" y="132" style="font: bold 16px 'Segoe UI'; fill: #fff;">i</text>
  <text x="125" y="130" class="text">Operation completed successfully.</text>
  <rect x="230" y="155" width="80" height="26" class="button" />
  <text x="258" y="173" class="text">OK</text>
  
  <!-- Question MessageBox -->
  <rect x="80" y="205" width="320" height="60" class="window" />
  <rect x="80" y="205" width="320" height="24" class="titlebar" />
  <text x="92" y="223" style="font: 14px 'Segoe UI'; fill: #fff;">Confirm</text>
  <text x="95" y="248" class="text">Delete this item?</text>
  <rect x="205" y="235" width="80" height="24" class="button" />
  <text x="230" y="252" class="text">Yes</text>
  <rect x="295" y="235" width="80" height="24" class="button" />
  <text x="323" y="252" class="text">No</text>

</svg>
