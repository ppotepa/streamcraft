<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420">
  <defs>
    <style>
      .title { font: 600 16px 'Segoe UI', Arial, sans-serif; fill: #ffffff; }
      .text { font: 13px 'Segoe UI', Arial, sans-serif; fill: #1b1b1b; }
      .muted { font: 12px 'Segoe UI', Arial, sans-serif; fill: #5a5a5a; }
      .window { fill: #c0c0c0; stroke: #000; stroke-width: 2; }
      .titlebar { fill: #000080; }
      .panel { fill: #ededed; stroke: #9a9a9a; stroke-width: 1; }
      .inset { fill: #ffffff; stroke: #7d7d7d; stroke-width: 1; }
      .button { fill: #d7d7d7; stroke: #7d7d7d; stroke-width: 1; }
      .menu { fill: #e6e6e6; stroke: #9a9a9a; stroke-width: 1; }
      .accent { fill: #000080; }
      .legend { font: 11px 'Segoe UI', Arial, sans-serif; fill: #1b1b1b; }
      .legendBox { fill: #ffffff; stroke: #7d7d7d; stroke-width: 1; }
      .scrollbar { fill: #d6d6d6; stroke: #8a8a8a; stroke-width: 1; }
      .scrollthumb { fill: #a8a8a8; stroke: #7d7d7d; stroke-width: 1; }
    </style>
  </defs>

  <!-- App window -->
  <rect x="20" y="20" width="720" height="380" class="window" />
  <rect x="20" y="20" width="720" height="28" class="titlebar" />
  <text x="34" y="40" class="title">Designer - Dock Panel with Scrollbar</text>

  <!-- Menu bar -->
  <rect x="36" y="56" width="688" height="26" class="menu" />
  <text x="46" y="74" class="text">File</text>
  <text x="86" y="74" class="text">Edit</text>
  <text x="132" y="74" class="text">View</text>
  <text x="182" y="74" class="text">Tools</text>

  <!-- Toolbar -->
  <rect x="36" y="82" width="688" height="32" class="panel" />
  <rect x="46" y="88" width="22" height="20" class="button" />
  <rect x="72" y="88" width="22" height="20" class="button" />
  <rect x="98" y="88" width="22" height="20" class="button" />
  <rect x="130" y="88" width="22" height="20" class="button" />

  <!-- Left toolbox -->
  <rect x="36" y="114" width="170" height="262" class="panel" />
  <rect x="36" y="114" width="170" height="22" class="menu" />
  <text x="46" y="129" class="text">Toolbox</text>
  <rect x="46" y="146" width="150" height="18" class="button" />
  <rect x="46" y="170" width="150" height="18" class="button" />
  <rect x="46" y="194" width="150" height="18" class="button" />
  <rect x="46" y="218" width="150" height="18" class="button" />
  <rect x="46" y="242" width="150" height="18" class="button" />
  <rect x="46" y="266" width="150" height="18" class="button" />

  <!-- Canvas -->
  <rect x="206" y="114" width="318" height="262" class="inset" />
  <text x="320" y="248" class="muted">Canvas</text>

  <!-- Dock panel (right) -->
  <rect x="524" y="114" width="200" height="262" class="panel" />

  <!-- Dock toggle -->
  <rect x="524" y="114" width="18" height="262" class="menu" />
  <text x="529" y="248" class="text">&gt;</text>

  <!-- Scrollbar -->
  <rect x="708" y="122" width="10" height="246" class="scrollbar" />
  <rect x="709" y="124" width="8" height="60" class="scrollthumb" />

  <!-- Docked groupbox: Properties -->
  <rect x="546" y="122" width="156" height="72" class="inset" />
  <rect x="552" y="118" width="74" height="14" class="menu" />
  <text x="556" y="129" class="text">Properties</text>
  <rect x="556" y="142" width="136" height="14" class="button" />
  <text x="562" y="152" class="muted">Width: 200</text>
  <rect x="556" y="160" width="136" height="14" class="button" />
  <text x="562" y="170" class="muted">Height: 100</text>
  <rect x="556" y="178" width="136" height="14" class="button" />
  <text x="562" y="188" class="muted">X: 120</text>

  <!-- Docked groupbox: Layers -->
  <rect x="546" y="200" width="156" height="64" class="inset" />
  <rect x="552" y="196" width="52" height="14" class="menu" />
  <text x="556" y="207" class="text">Layers</text>
  <rect x="556" y="218" width="136" height="14" class="button" />
  <text x="562" y="228" class="muted">▼ Layer 1</text>
  <rect x="556" y="236" width="136" height="14" class="button" />
  <text x="562" y="246" class="muted">▼ Layer 2</text>
  <rect x="556" y="254" width="136" height="14" class="button" />
  <text x="562" y="264" class="muted">▼ Background</text>

  <!-- Docked groupbox: Workers -->
  <rect x="546" y="270" width="156" height="54" class="inset" />
  <rect x="552" y="266" width="58" height="14" class="menu" />
  <text x="556" y="277" class="text">Workers</text>
  <rect x="556" y="288" width="136" height="14" class="button" />
  <text x="562" y="298" class="muted">Worker 1: Active</text>
  <rect x="556" y="306" width="136" height="14" class="button" />
  <text x="562" y="316" class="muted">Worker 2: Idle</text>

  <!-- Docked groupbox: Data Sources (partially visible) -->
  <rect x="546" y="330" width="156" height="38" class="inset" />
  <rect x="552" y="326" width="86" height="14" class="menu" />
  <text x="556" y="337" class="text">Data Sources</text>
  <rect x="556" y="348" width="136" height="14" class="button" />
  <text x="562" y="358" class="muted">Database 1</text>

  <!-- Legend markers -->
  <rect x="710" y="126" width="14" height="14" class="legendBox" />
  <text x="714" y="137" class="legend">1</text>
  <rect x="688" y="202" width="14" height="14" class="legendBox" />
  <text x="692" y="213" class="legend">2</text>
  <rect x="688" y="272" width="14" height="14" class="legendBox" />
  <text x="692" y="283" class="legend">3</text>

  <!-- Legend text -->
  <text x="36" y="404" class="legend">1 Vertical scrollbar for overflow content</text>
  <text x="270" y="404" class="legend">2 Multiple docked panels stacked vertically</text>
  <text x="540" y="404" class="legend">3 Scroll to view more panels</text>
</svg>
