<?xml version="1.0" encoding="utf-8"?>
<!-- Raptor UI: Advanced Graphic Design Application Mockup -->
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" aria-label="Raptor Design Studio mockup" role="img">
  <metadata>Raptor Design Studio - Example UI mockup generated by assistant</metadata>
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1724" />
      <stop offset="100%" stop-color="#152a3a" />
    </linearGradient>

    <linearGradient id="panelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#e6eef5" stop-opacity="0.96"/>
    </linearGradient>

    <radialGradient id="canvasRad" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#f7fbff" stop-opacity="1"/>
    </radialGradient>

    <!-- Complex gradient for accent -->
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="50%" stop-color="#ffb86b"/>
      <stop offset="100%" stop-color="#6bffb8"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.25"/>
    </filter>

    <filter id="innerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Icon symbols -->
    <symbol id="icon-rect" viewBox="0 0 24 24">
      <rect x="3" y="4" width="18" height="16" rx="2" fill="#fff" stroke="#2b3b4a" stroke-width="1"/>
    </symbol>
    <symbol id="icon-ellipse" viewBox="0 0 24 24">
      <ellipse cx="12" cy="12" rx="9" ry="6" fill="#fff" stroke="#2b3b4a" stroke-width="1"/>
    </symbol>
    <symbol id="icon-pen" viewBox="0 0 24 24">
      <path d="M3 21l3-1 12-12 2 2-12 12-1 3z" fill="#fff" stroke="#2b3b4a" stroke-width="1"/>
    </symbol>

    <!-- Pattern: diagonal hatch -->
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" fill="none"/>
      <path d="M0 0L24 24M24 0L0 24" stroke="#e7eef6" opacity="0.12" stroke-width="1"/>
    </pattern>

    <!-- Decorative neon stroke -->
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#66fffd" />
      <stop offset="100%" stop-color="#6b6bff" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGradient)" />

  <!-- Header / Menu bar -->
  <g transform="translate(0,0)">
    <rect x="0" y="0" width="1920" height="56" fill="#0b1a26" opacity="0.9" />
    <text x="20" y="36" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">Raptor Design Studio</text>

    <!-- Menu items -->
    <g transform="translate(240,8)" fill="#b8d6ff" font-family="Inter, Arial, sans-serif" font-size="13">
      <text x="0" y="14">File</text>
      <text x="60" y="14">Edit</text>
      <text x="120" y="14">View</text>
      <text x="190" y="14">Layer</text>
      <text x="260" y="14">Select</text>
      <text x="330" y="14">Filter</text>
    </g>

    <!-- Right controls -->
    <g transform="translate(1560,10)">
      <rect x="0" y="0" width="60" height="36" rx="6" fill="#142733" stroke="#255069" stroke-width="1"/>
      <text x="30" y="24" font-family="Inter, Arial" font-size="12" fill="#8bd3ff" text-anchor="middle">Preview</text>
    </g>
  </g>

  <!-- Left tools column -->
  <g id="left-tools" transform="translate(16,76)">
    <rect x="0" y="0" width="72" height="920" rx="12" fill="#07101a" opacity="0.95" filter="url(#softShadow)"/>

    <g transform="translate(12,14)" fill="#e8f5ff">
      <rect x="0" y="0" width="48" height="48" rx="8" fill="#1f6fb3" />
      <use href="#icon-rect" x="12" y="12" width="24" height="24"/>

      <g transform="translate(0,68)">
        <rect x="0" y="0" width="48" height="48" rx="8" fill="#2ab57a" />
        <use href="#icon-ellipse" x="12" y="12" width="24" height="24"/>
      </g>

      <g transform="translate(0,136)">
        <rect x="0" y="0" width="48" height="48" rx="8" fill="#ffb74d" />
        <use href="#icon-pen" x="10" y="10" width="28" height="28"/>
      </g>

      <g transform="translate(0,204)">
        <rect x="0" y="0" width="48" height="48" rx="8" fill="#9b59ff" />
        <path d="M12 18 L24 6" stroke="#fff" stroke-width="2"/>
      </g>
    </g>

    <!-- mini color strip -->
    <g transform="translate(12,420)">
      <rect x="0" y="0" width="48" height="10" fill="#ff6b6b"/>
      <rect x="0" y="12" width="48" height="10" fill="#ffb86b"/>
      <rect x="0" y="24" width="48" height="10" fill="#6bffb8"/>
    </g>
  </g>

  <!-- Right side property panels -->
  <g id="right-panels" transform="translate(1580,76)">
    <rect x="0" y="0" width="320" height="920" rx="12" fill="url(#panelGrad)" stroke="#cfe6ff" stroke-width="1" filter="url(#softShadow)" />

    <text x="20" y="28" font-family="Inter, Arial" font-size="14" fill="#223a4a" font-weight="700">Properties</text>
    <rect x="20" y="36" width="280" height="1" fill="#dbeaf8"/>

    <!-- color swatches -->
    <g transform="translate(20,56)">
      <rect x="0" y="0" width="64" height="44" rx="6" fill="#ff6b6b" stroke="#8b2b2b"/>
      <rect x="76" y="0" width="64" height="44" rx="6" fill="#3498db" stroke="#2b6ba4"/>
      <rect x="152" y="0" width="64" height="44" rx="6" fill="#2ecc71" stroke="#178f54"/>
      <rect x="228" y="0" width="64" height="44" rx="6" fill="#f1c40f" stroke="#b08a0f"/>
    </g>

    <!-- Layers list -->
    <text x="20" y="140" font-family="Inter, Arial" font-size="13" fill="#2b3f50" font-weight="700">Layers</text>
    <rect x="20" y="146" width="280" height="1" fill="#dbeaf8"/>

    <g transform="translate(20,160)" font-family="Inter, Arial" font-size="12" fill="#223a4a">
      <rect x="0" y="0" width="280" height="36" rx="6" fill="#fff" stroke="#d6eaf8"/>
      <text x="16" y="22">Layer 1 • Design</text>
      <circle cx="250" cy="18" r="6" fill="#2ecc71"/>

      <g transform="translate(0,48)">
        <rect x="0" y="0" width="280" height="36" rx="6" fill="#fff" stroke="#d6eaf8"/>
        <text x="16" y="22">Background</text>
        <circle cx="250" cy="18" r="6" fill="#e74c3c"/>
      </g>
    </g>

    <!-- history -->
    <text x="20" y="260" font-family="Inter, Arial" font-size="13" fill="#2b3f50" font-weight="700">History</text>
    <rect x="20" y="266" width="280" height="1" fill="#dbeaf8"/>
    <g transform="translate(20,280)" font-family="Inter, Arial" font-size="11" fill="#223a4a">
      <text x="0" y="16">• Added Rectangle</text>
      <text x="0" y="36">• Moved Circle</text>
      <text x="0" y="56">• Applied Gradient</text>
      <text x="0" y="76">• Added Text</text>
    </g>
  </g>

  <!-- Canvas area -->
  <g id="canvas" transform="translate(112,96)">
    <rect x="0" y="0" width="1400" height="820" rx="10" fill="url(#canvasRad)" stroke="#bbdff7" stroke-width="2" filter="url(#softShadow)"/>

    <!-- subtle grid overlay -->
    <rect x="0" y="0" width="1400" height="820" fill="url(#grid)" opacity="0.45"/>

    <!-- artboard inner area -->
    <rect x="40" y="40" width="1320" height="740" rx="6" fill="#fff" stroke="#dbeaf8" stroke-width="1"/>

    <!-- sample elements -->
    <g id="shapes">
      <rect x="100" y="80" width="360" height="220" rx="14" fill="url(#accent)" stroke="#c04e4e" stroke-width="3" opacity="0.95"/>
      <ellipse cx="640" cy="160" rx="120" ry="70" fill="#6b9cff" stroke="#2b5fb5" stroke-width="3"/>
      <polygon points="980,80 1060,320 900,320" fill="#7df2b0" stroke="#3cae70" stroke-width="3"/>

      <!-- layered text with neon stroke -->
      <g transform="translate(1240,220)">
        <text x="0" y="0" font-family="Inter, Arial" font-size="72" fill="#0b2540" font-weight="800">RAPTOR</text>
        <text x="0" y="0" font-family="Inter, Arial" font-size="72" fill="none" stroke="url(#neon)" stroke-width="1" opacity="0.9">RAPTOR</text>
      </g>

      <!-- complex path demo -->
      <path d="M 200 420 C 340 320 540 520 680 420 S 1020 260 1160 420" stroke="#ff8fb1" stroke-width="6" fill="none" stroke-linecap="round"/>

      <!-- mask / clipping example -->
      <defs>
        <clipPath id="clip-star">
          <path d="M1240 480 L1260 520 L1300 528 L1270 552 L1280 592 L1240 572 L1200 592 L1210 552 L1180 528 L1220 520 Z"/>
        </clipPath>
      </defs>
      <rect x="1180" y="460" width="140" height="140" fill="#f7c46b" clip-path="url(#clip-star)" />

      <!-- group transform + opacity -->
      <g transform="translate(300,340) rotate(-12)" opacity="0.95">
        <rect x="0" y="0" width="180" height="120" rx="8" fill="#ffffff" stroke="#d0e8ff"/>
        <circle cx="120" cy="60" r="40" fill="#ff6b6b"/>
      </g>
    </g>

    <!-- floating inspector window inside canvas -->
    <g id="inspector" transform="translate(980,520)">
      <rect x="0" y="0" width="320" height="160" rx="8" fill="#071b26" opacity="0.96" stroke="#13404f"/>
      <text x="16" y="26" fill="#9be8ff" font-family="Inter, Arial" font-size="13" font-weight="700">Inspector</text>
      <rect x="16" y="40" width="120" height="28" rx="6" fill="#12333d" stroke="#1e4d59"/>
      <text x="24" y="60" fill="#bfefff" font-family="Inter, Arial" font-size="12">W: 360px</text>
      <rect x="160" y="40" width="120" height="28" rx="6" fill="#12333d" stroke="#1e4d59"/>
      <text x="168" y="60" fill="#bfefff" font-family="Inter, Arial" font-size="12">H: 220px</text>
    </g>

    <!-- ruler guides -->
    <g transform="translate(40,0)">
      <rect x="0" y="0" width="1320" height="20" fill="#f7fbff" opacity="0.95"/>
      <!-- marks -->
      <g stroke="#c0d7ea" stroke-width="1">
        <line x1="0" y1="20" x2="0" y2="10"/>
        <line x1="40" y1="20" x2="40" y2="14"/>
        <line x1="80" y1="20" x2="80" y2="14"/>
        <line x1="120" y1="20" x2="120" y2="10"/>
      </g>
    </g>

  </g>

  <!-- Footer status bar -->
  <g transform="translate(0,988)">
    <rect x="0" y="0" width="1920" height="92" fill="#071822" opacity="0.95"/>
    <text x="24" y="36" fill="#9bd7ff" font-family="Inter, Arial" font-size="13">Zoom: 100% • X: 420 Y: 360 • RGB: 255,99,99</text>
    <text x="1700" y="36" fill="#9bd7ff" font-family="Inter, Arial" font-size="13">Document • 1400x820 • RGB/HEX</text>
  </g>

</svg>
