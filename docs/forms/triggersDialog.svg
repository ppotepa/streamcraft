<svg xmlns="http://www.w3.org/2000/svg" width="700" height="520" viewBox="0 0 700 520">
  <defs>
    <style>
      .title { font: 600 16px 'Segoe UI', Arial, sans-serif; fill: #ffffff; }
      .text { font: 14px 'Segoe UI', Arial, sans-serif; fill: #1b1b1b; }
      .small { font: 12px 'Segoe UI', Arial, sans-serif; fill: #1b1b1b; }
      .muted { font: 12px 'Segoe UI', Arial, sans-serif; fill: #5a5a5a; }
      .window { fill: #c0c0c0; stroke: #000; stroke-width: 2; }
      .titlebar { fill: #000080; }
      .panel { fill: #ededed; stroke: #9a9a9a; stroke-width: 1; }
      .inset { fill: #ffffff; stroke: #7d7d7d; stroke-width: 1; }
      .button { fill: #d7d7d7; stroke: #7d7d7d; stroke-width: 1; }
      .label { font: 12px 'Segoe UI', Arial, sans-serif; fill: #1b1b1b; }
      .trigger-item { fill: #f8f8f8; stroke: #9a9a9a; stroke-width: 1; }
      .trigger-selected { fill: #000080; }
    </style>
  </defs>
  
  <!-- Window -->
  <rect x="40" y="30" width="620" height="460" class="window" />
  <rect x="40" y="30" width="620" height="28" class="titlebar" />
  <text x="54" y="50" class="title">Trigger Editor</text>
  <rect x="648" y="34" width="8" height="8" fill="#ffffff" />
  
  <!-- Content Area -->
  <rect x="50" y="68" width="600" height="390" class="panel" />
  
  <!-- Trigger List Section -->
  <text x="60" y="92" class="muted">Configured Triggers</text>
  
  <!-- Trigger List -->
  <rect x="60" y="102" width="280" height="280" class="inset" />
  
  <!-- Trigger Items -->
  <rect x="65" y="107" width="270" height="32" class="trigger-selected" />
  <text x="75" y="123" style="font: 12px 'Segoe UI'; fill: #fff;">On Value Change</text>
  <text x="75" y="135" style="font: 10px 'Segoe UI'; fill: #fff;">Execute when value changes</text>
  
  <rect x="65" y="141" width="270" height="32" class="trigger-item" />
  <text x="75" y="157" class="small">On Interval</text>
  <text x="75" y="169" style="font: 10px 'Segoe UI'; fill: #5a5a5a;">Execute every 5000 ms</text>
  
  <rect x="65" y="175" width="270" height="32" class="trigger-item" />
  <text x="75" y="191" class="small">On Error</text>
  <text x="75" y="203" style="font: 10px 'Segoe UI'; fill: #5a5a5a;">Execute on fetch error</text>
  
  <!-- List Buttons -->
  <rect x="60" y="392" width="90" height="26" class="button" />
  <text x="88" y="410" class="text">Add</text>
  
  <rect x="160" y="392" width="90" height="26" class="button" />
  <text x="180" y="410" class="text">Remove</text>
  
  <rect x="260" y="392" width="80" height="26" class="button" />
  <text x="285" y="410" class="text">Edit</text>
  
  <!-- Trigger Details Section -->
  <text x="360" y="92" class="muted">Trigger Details</text>
  
  <!-- Type -->
  <text x="360" y="117" class="label">Type:</text>
  <rect x="460" y="104" width="170" height="22" class="inset" />
  <text x="470" y="120" class="small">On Value Change</text>
  <polygon points="620,114 615,119 610,114" fill="#000" />
  
  <!-- Condition -->
  <text x="360" y="147" class="label">Condition:</text>
  <rect x="460" y="134" width="170" height="22" class="inset" />
  <text x="470" y="150" class="small">value !== oldValue</text>
  
  <!-- Action -->
  <text x="360" y="177" class="label">Action:</text>
  <rect x="460" y="164" width="170" height="22" class="inset" />
  <text x="470" y="180" class="small">Refresh Data</text>
  <polygon points="620,174 615,179 610,174" fill="#000" />
  
  <!-- Enabled -->
  <rect x="360" y="200" width="14" height="14" class="inset" />
  <line x1="362" y1="207" x2="366" y2="212" stroke="#000" stroke-width="2" />
  <line x1="366" y1="212" x2="372" y2="202" stroke="#000" stroke-width="2" />
  <text x="382" y="212" class="label">Enabled</text>
  
  <line x1="360" y1="235" x2="630" y2="235" stroke="#9a9a9a" stroke-width="1" />
  
  <!-- Advanced Settings -->
  <text x="360" y="258" class="muted">Advanced Settings</text>
  
  <!-- Debounce -->
  <text x="360" y="283" class="label">Debounce (ms):</text>
  <rect x="460" y="270" width="100" height="22" class="inset" />
  <text x="470" y="286" class="small">300</text>
  
  <!-- Throttle -->
  <text x="360" y="313" class="label">Throttle (ms):</text>
  <rect x="460" y="300" width="100" height="22" class="inset" />
  <text x="470" y="316" class="small">0</text>
  
  <!-- Priority -->
  <text x="360" y="343" class="label">Priority:</text>
  <rect x="460" y="330" width="100" height="22" class="inset" />
  <text x="470" y="346" class="small">Normal</text>
  <polygon points="550,340 545,345 540,340" fill="#000" />
  
  <!-- Cancel Previous -->
  <rect x="360" y="363" width="14" height="14" class="inset" />
  <text x="382" y="375" class="label">Cancel previous execution</text>
  
  <!-- Dialog Buttons -->
  <rect x="460" y="468" width="90" height="28" class="button" />
  <text x="485" y="487" class="text">Cancel</text>
  
  <rect x="560" y="468" width="90" height="28" class="button" />
  <text x="595" y="487" class="text">OK</text>
</svg>
