<svg xmlns="http://www.w3.org/2000/svg" width="600" height="480" viewBox="0 0 600 480">
  <defs>
    <style>
      .title { font: 600 16px 'Segoe UI', Arial, sans-serif; fill: #ffffff; }
      .text { font: 14px 'Segoe UI', Arial, sans-serif; fill: #1b1b1b; }
      .small { font: 12px 'Segoe UI', Arial, sans-serif; fill: #1b1b1b; }
      .muted { font: 12px 'Segoe UI', Arial, sans-serif; fill: #5a5a5a; }
      .window { fill: #c0c0c0; stroke: #000; stroke-width: 2; }
      .titlebar { fill: #000080; }
      .panel { fill: #ededed; stroke: #9a9a9a; stroke-width: 1; }
      .inset { fill: #ffffff; stroke: #7d7d7d; stroke-width: 1; }
      .button { fill: #d7d7d7; stroke: #7d7d7d; stroke-width: 1; }
      .label { font: 12px 'Segoe UI', Arial, sans-serif; fill: #1b1b1b; }
    </style>
  </defs>
  
  <!-- Window -->
  <rect x="40" y="30" width="520" height="420" class="window" />
  <rect x="40" y="30" width="520" height="28" class="titlebar" />
  <text x="54" y="50" class="title">Worker Setup</text>
  <rect x="548" y="34" width="8" height="8" fill="#ffffff" />
  
  <!-- Content Area -->
  <rect x="50" y="68" width="500" height="350" class="panel" />
  
  <!-- Execution Settings -->
  <text x="60" y="92" class="muted">Execution Settings</text>
  
  <!-- Auto-start -->
  <rect x="60" y="105" width="14" height="14" class="inset" />
  <line x1="62" y1="112" x2="66" y2="117" stroke="#000" stroke-width="2" />
  <line x1="66" y1="117" x2="72" y2="107" stroke="#000" stroke-width="2" />
  <text x="82" y="117" class="label">Auto-start when bound</text>
  
  <!-- Enable Logging -->
  <rect x="60" y="135" width="14" height="14" class="inset" />
  <text x="82" y="147" class="label">Enable execution logging</text>
  
  <!-- Retry on Error -->
  <rect x="60" y="165" width="14" height="14" class="inset" />
  <text x="82" y="177" class="label">Retry on error</text>
  
  <!-- Max Retries -->
  <text x="60" y="207" class="label">Max Retries:</text>
  <rect x="200" y="194" width="80" height="22" class="inset" />
  <text x="210" y="210" class="small">3</text>
  
  <!-- Retry Delay -->
  <text x="60" y="237" class="label">Retry Delay (ms):</text>
  <rect x="200" y="224" width="80" height="22" class="inset" />
  <text x="210" y="240" class="small">1000</text>
  
  <line x1="60" y1="260" x2="530" y2="260" stroke="#9a9a9a" stroke-width="1" />
  
  <!-- Performance Settings -->
  <text x="60" y="283" class="muted">Performance Settings</text>
  
  <!-- Throttle Execution -->
  <rect x="60" y="296" width="14" height="14" class="inset" />
  <text x="82" y="308" class="label">Throttle execution</text>
  
  <!-- Min Interval -->
  <text x="60" y="338" class="label">Min Interval (ms):</text>
  <rect x="200" y="325" width="80" height="22" class="inset" />
  <text x="210" y="341" class="small">250</text>
  
  <!-- Timeout -->
  <text x="60" y="368" class="label">Timeout (ms):</text>
  <rect x="200" y="355" width="80" height="22" class="inset" />
  <text x="210" y="371" class="small">5000</text>
  
  <!-- Cancel on Unmount -->
  <rect x="60" y="387" width="14" height="14" class="inset" />
  <line x1="62" y1="394" x2="66" y2="399" stroke="#000" stroke-width="2" />
  <line x1="66" y1="399" x2="72" y2="389" stroke="#000" stroke-width="2" />
  <text x="82" y="399" class="label">Cancel pending requests on unmount</text>
  
  <!-- Action Buttons -->
  <rect x="360" y="428" width="90" height="28" class="button" />
  <text x="385" y="447" class="text">Cancel</text>
  
  <rect x="460" y="428" width="90" height="28" class="button" />
  <text x="495" y="447" class="text">OK</text>
</svg>
