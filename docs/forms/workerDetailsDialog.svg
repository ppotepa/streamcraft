<svg xmlns="http://www.w3.org/2000/svg" width="700" height="480" viewBox="0 0 700 480">
  <defs>
    <style>
      .title { font: 600 16px 'Segoe UI', Arial, sans-serif; fill: #ffffff; }
      .text { font: 14px 'Segoe UI', Arial, sans-serif; fill: #1b1b1b; }
      .small { font: 12px 'Segoe UI', Arial, sans-serif; fill: #1b1b1b; }
      .muted { font: 12px 'Segoe UI', Arial, sans-serif; fill: #5a5a5a; }
      .window { fill: #c0c0c0; stroke: #000; stroke-width: 2; }
      .titlebar { fill: #000080; }
      .panel { fill: #ededed; stroke: #9a9a9a; stroke-width: 1; }
      .inset { fill: #ffffff; stroke: #7d7d7d; stroke-width: 1; }
      .button { fill: #d7d7d7; stroke: #7d7d7d; stroke-width: 1; }
      .label { font: 12px 'Segoe UI', Arial, sans-serif; fill: #1b1b1b; }
      .status-running { fill: #28a745; }
      .status-stopped { fill: #6c757d; }
    </style>
  </defs>
  
  <!-- Window -->
  <rect x="40" y="30" width="620" height="420" class="window" />
  <rect x="40" y="30" width="620" height="28" class="titlebar" />
  <text x="54" y="50" class="title">Worker Details</text>
  <rect x="648" y="34" width="8" height="8" fill="#ffffff" />
  
  <!-- Content Area -->
  <rect x="50" y="68" width="600" height="350" class="panel" />
  
  <!-- Worker Info Section -->
  <text x="60" y="92" class="muted">Worker Information</text>
  
  <!-- Worker Name -->
  <text x="60" y="117" class="label">Name:</text>
  <text x="200" y="117" class="text">lblStatus Worker</text>
  
  <!-- Status -->
  <text x="60" y="142" class="label">Status:</text>
  <circle cx="205" cy="138" r="5" class="status-running" />
  <text x="218" y="142" class="text">Running</text>
  
  <!-- Interval -->
  <text x="60" y="167" class="label">Interval:</text>
  <text x="200" y="167" class="text">1000 ms</text>
  
  <!-- Source -->
  <text x="60" y="192" class="label">Data Source:</text>
  <text x="200" y="192" class="text">SC2 Pulse API</text>
  
  <!-- Endpoint -->
  <text x="60" y="217" class="label">Endpoint:</text>
  <text x="200" y="217" class="text">GET /player/:id</text>
  
  <!-- Field Path -->
  <text x="60" y="242" class="label">Field Path:</text>
  <text x="200" y="242" class="text">response.player.name</text>
  
  <line x1="60" y1="260" x2="630" y2="260" stroke="#9a9a9a" stroke-width="1" />
  
  <!-- Execution Stats -->
  <text x="60" y="283" class="muted">Execution Statistics</text>
  
  <text x="60" y="308" class="label">Total Executions:</text>
  <text x="200" y="308" class="text">1,247</text>
  
  <text x="60" y="333" class="label">Success Rate:</text>
  <text x="200" y="333" class="text">98.5%</text>
  
  <text x="60" y="358" class="label">Last Execution:</text>
  <text x="200" y="358" class="text">2 seconds ago</text>
  
  <text x="60" y="383" class="label">Next Execution:</text>
  <text x="200" y="383" class="text">in 998 ms</text>
  
  <!-- Action Buttons -->
  <rect x="390" y="428" width="90" height="28" class="button" />
  <text x="420" y="447" class="text">Start</text>
  
  <rect x="490" y="428" width="90" height="28" class="button" />
  <text x="520" y="447" class="text">Stop</text>
  
  <rect x="590" y="428" width="90" height="28" class="button" />
  <text x="615" y="447" class="text">Close</text>
</svg>
